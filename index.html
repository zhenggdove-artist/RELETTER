    /* ===== 標題字型 Golden Girdle =====
       如要更換標題字型，替換下方 src 的 url 路徑即可 */
    @font-face{
      font-family:"GoldenGirdle";
      src:url("FONTS/Golden Girdle.otf") format("opentype");
      font-weight:normal;
      font-style:normal;
      font-display:swap;
    }
    @font-face{
      font-family:"Bristol";
      src:url("FONTS/Bristol.otf") format("opentype");
      font-weight:normal;
      font-style:normal;
      font-display:swap;
    }
    @font-face{
      font-family:"FFComma";
      src:url("FONTS/FFCommaTrial-Regular.ttf") format("truetype");
      font-weight:normal;
      font-style:normal;
      font-display:swap;
    }
    :root{
      --ui-lav:#e7ddff;
      --ui-lav-2:#cdbcf4;
      --ui-sky:#bfe3ff;
      --ui-shadow:rgba(73,64,122,0.35);
      --ui-ink:#ffffff;
      --ui-ink-soft:#f2f6ff;
      --bubble-1:#f6b5da;
      --bubble-2:#e6c6ff;
      --bubble-3:#cfe6ff;
      --bubble-edge:#bda6e6;
      --bubble-shadow:rgba(110,80,140,0.35);
      --bubble-text:#8a6cc0;
    }
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Saint","Trebuchet MS",sans-serif}
    button,input,textarea{font-family:"Saint","Trebuchet MS",sans-serif}
    #ui,#ui *,#pop,#search-panel,#search-panel *,#search-btn,#title,#mouth-text-layer{font-family:"Saint","Trebuchet MS",sans-serif}
    #c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    #ui{position:absolute;right:6vw;bottom:2vh;left:auto;top:auto;
      width:min(72vw,420px);
      background:radial-gradient(circle at 30% 20%,#fff3fb 0%,var(--bubble-1) 45%,var(--bubble-2) 100%);
      border:2px solid var(--bubble-edge);padding:0;z-index:10;color:var(--bubble-text);
      transition:all 0.25s;border-radius:26px;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.6),
        0 10px 22px var(--bubble-shadow)}
    @media (max-width: 640px){
      #ui{right:3vw;bottom:2vh;left:3vw;width:auto}
    }
    #ui.mini{width:49px;height:35px;padding:0;cursor:pointer;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle at 30% 20%,#fff3fb 0%,var(--bubble-1) 55%,var(--bubble-2) 100%);
      right:22px;bottom:24px;left:auto;top:auto}
    #ui.mini h2,#ui.mini textarea,#ui.mini button#go,#ui.mini #username,#ui.mini div{display:none}
    #ui.mini::after{content:'WRITE';font-size:7px;letter-spacing:1px;color:#7555a8;text-transform:uppercase;font-family:"Saint","Trebuchet MS",sans-serif}
    #ui.mini.done-state::after{content:'RETURN'}
    #ui.hidden{opacity:0;pointer-events:none}
    #ui h2{font-size:13px;letter-spacing:2px;color:#E84887;margin:6px 12px 2px;font-family:"Saint","Trebuchet MS",sans-serif;
      text-shadow:0 1px 0 rgba(255,255,255,0.7)}
    #ui textarea{width:calc(100% - 24px);height:64px;margin:6px 12px 6px;
      background:radial-gradient(circle at 25% 15%,#fff 0%,#fbe3f3 55%,#f3c8e3 100%);
      border:2px solid var(--bubble-edge);color:var(--bubble-text);
      padding:10px 12px;font-size:14px;resize:none;outline:none;border-radius:24px;
      box-shadow:inset 0 0 10px rgba(255,255,255,0.8)}
    #go{margin:0 12px 8px;width:calc(100% - 24px);height:34px;
      background:radial-gradient(circle at 25% 20%,#fff 0%,#e7cfff 55%,#d7b8ff 100%);
      border:2px solid var(--bubble-edge);color:#E84887;text-transform:uppercase;letter-spacing:3px;
      cursor:pointer;font-family:"Saint","Trebuchet MS",sans-serif;border-radius:999px;
      box-shadow:0 6px 14px var(--bubble-shadow)}
    #go:disabled{opacity:0.4;cursor:not-allowed}
    #pop{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
      max-width:min(90vw,600px);max-height:40vh;overflow-y:auto;
      background:linear-gradient(160deg,rgba(231,221,255,0.7),rgba(191,227,255,0.4));color:var(--ui-ink);
      border:1px solid rgba(255,255,255,0.5);padding:12px 16px;z-index:12;display:none;
      font-size:14px;letter-spacing:1px;border-radius:16px;backdrop-filter:blur(6px);
      white-space:pre-wrap;word-break:break-word;overscroll-behavior:contain}
    #pop.show{display:block}
    #pop::-webkit-scrollbar{width:4px}
    #pop::-webkit-scrollbar-thumb{background:rgba(180,170,230,0.6);border-radius:2px}
    #search-btn{position:absolute;bottom:24px;left:22px;width:49px;height:35px;
      background:radial-gradient(circle at 30% 20%,#fff 0%,var(--bubble-1) 55%,var(--bubble-2) 100%);
      border:2px solid var(--bubble-edge);color:var(--bubble-text);
      border-radius:999px;cursor:pointer;z-index:14;font-family:inherit;font-size:0;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 6px 14px var(--bubble-shadow)}
    #search-btn::before{content:"›";font-size:17px;color:#7555a8;text-shadow:0 1px 0 rgba(255,255,255,0.7);font-family:"Saint","Trebuchet MS",sans-serif}
    #search-panel{position:absolute;bottom:86px;left:22px;width:min(70vw,330px);
      background:radial-gradient(circle at 30% 20%,#fff 0%,var(--bubble-1) 55%,var(--bubble-2) 100%);
      border:2px solid var(--bubble-edge);
      padding:10px;z-index:15;border-radius:24px;display:none;
      box-shadow:0 10px 22px var(--bubble-shadow)}
    #search-panel.show{display:block}
    #search-panel input{width:100%;height:32px;background:#fff0f8;border:2px solid var(--bubble-edge);
      color:var(--bubble-text);padding:0 10px;font-size:13px;outline:none;border-radius:999px;font-family:inherit;
      box-shadow:inset 0 0 8px rgba(255,255,255,0.8)}
    #search-results{margin-top:10px;max-height:30vh;overflow-y:auto;overscroll-behavior:contain}
    #search-results::-webkit-scrollbar{width:4px}
    #search-results::-webkit-scrollbar-thumb{background:#c77c90;border-radius:2px}
    .sr-item{padding:8px 14px;margin-bottom:6px;background:#fff0f8;border-radius:16px;
      color:var(--bubble-text);font-size:12px;cursor:pointer;word-break:break-word;border:2px solid var(--bubble-edge);
      box-shadow:0 4px 10px var(--bubble-shadow)}
    .sr-item:hover{border-color:#bfa6f0}
    #plant-label{position:absolute;left:0;top:0;transform:translate(-50%,0);
      padding:12px 16px;
      background:linear-gradient(160deg,rgba(231,221,255,0.7),rgba(191,227,255,0.4));
      color:var(--ui-ink);
      border:1px solid rgba(255,255,255,0.5);border-radius:16px;backdrop-filter:blur(6px);
      font-size:14px;letter-spacing:1px;z-index:16;display:none;pointer-events:none;
      text-align:center;max-width:min(90vw,600px);white-space:pre-wrap;word-break:break-word}
    #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;
      transition:opacity 0.6s ease;z-index:20}
    #fade.show{opacity:1}
    /* ===== TITLE STYLE =====
       手動微調標題位置：修改 left 值（目前 50%）
       修改 top 值調整垂直位置 */
    #title{position:absolute;top:3vh;left:50%;
      transform:translateX(-50%) perspective(200px) rotateX(6deg);
      font-size:clamp(18px,5.5vw,48px);letter-spacing:0.35em;font-weight:bold;
      font-family:"GoldenGirdle","Saint","Trebuchet MS",sans-serif;
      text-transform:uppercase;z-index:12;pointer-events:none;
      white-space:nowrap;text-align:center;
      color:#f2b7cf;
      -webkit-text-stroke:0.5px rgba(255,255,255,0.25);
      text-shadow:
        0 1px 0 #f7cfe0,
        0 2px 0 #efbcd3,
        0 3px 0 #e3a6c1,
        0 4px 0 #d394b2,
        0 6px 8px rgba(0,0,0,0.18);
      transition:opacity 1.5s ease}
    #title.fade-out{opacity:0}
    #title span{display:inline-block}
    #title span:last-child{letter-spacing:0}
    @media(max-width:640px){
      #title{
        text-shadow:
          0 1px 0 #f7cfe0,
          0 2px 0 #efbcd3,
          0 3px 0 #e3a6c1,
          0 4px 0 #d394b2,
          0 5px 6px rgba(0,0,0,0.15);
        background:linear-gradient(135deg,#f2b7cf 0%,#fce4ec 25%,#e8a0bd 50%,#fff0f5 75%,#f2b7cf 100%);
        background-size:200% 200%;
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        background-clip:text;
        animation:titleShimmer 4s ease infinite}
    }
    @keyframes titleShimmer{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }
    #mouth-text-layer{position:fixed;inset:0;pointer-events:none;z-index:18}
    .mouth-text{position:absolute;color:#ff1f1f;font-size:16px;letter-spacing:1px;
      text-shadow:0 1px 0 rgba(255,255,255,0.5);white-space:nowrap}
    /* ===== Game Controls ===== */
    #game-controls{position:fixed;bottom:0;left:0;right:0;height:40vh;z-index:15;
      pointer-events:none;display:block}
    #game-controls.hide{display:none}
    #joystick-zone{position:absolute;left:20px;bottom:90px;width:70px;height:70px;
      pointer-events:auto;touch-action:none}
    #joystick-base{position:absolute;inset:0;border-radius:50%;
      background:radial-gradient(circle at 30% 20%,rgba(255,243,251,0.7),rgba(233,196,230,0.5));
      border:2px solid var(--bubble-edge);
      box-shadow:inset 0 0 0 2px rgba(255,255,255,0.5),0 6px 14px var(--bubble-shadow)}
    #joystick-stick{position:absolute;width:28px;height:28px;border-radius:50%;
      left:50%;top:50%;transform:translate(-50%,-50%);
      background:radial-gradient(circle at 35% 25%,#fff 0%,var(--bubble-1) 50%,var(--bubble-2) 100%);
      border:2px solid var(--bubble-edge);
      box-shadow:0 4px 10px var(--bubble-shadow)}
    #jump-btn{position:absolute;right:20px;bottom:90px;width:50px;height:50px;
      border-radius:50%;cursor:pointer;pointer-events:auto;touch-action:none;
      background:radial-gradient(circle at 30% 20%,#fff3fb 0%,var(--bubble-1) 55%,var(--bubble-2) 100%);
      border:2px solid var(--bubble-edge);
      box-shadow:inset 0 0 0 2px rgba(255,255,255,0.5),0 6px 14px var(--bubble-shadow);
      font-family:"GoldenGirdle","Saint",sans-serif;font-size:10px;letter-spacing:1px;
      color:var(--bubble-text);text-transform:uppercase;display:flex;align-items:center;justify-content:center}
    #jump-btn:active{transform:scale(0.92)}
    /* Artist statement overlay */
    #statement-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.55);z-index:300;align-items:center;justify-content:center}
    #statement-overlay.show{display:flex}
    #statement-box{transition:transform 0.3s ease-out}
    #statement-box{max-width:min(88vw,520px);max-height:80vh;overflow-y:auto;
      background:radial-gradient(circle at 30% 20%,#fff8fc 0%,#f3d5ea 55%,#e8b8d8 100%);
      border:2px solid var(--bubble-edge);border-radius:22px;padding:28px 24px;
      font-family:"Saint",sans-serif;color:#3a2050;font-size:14px;line-height:1.9;
      letter-spacing:0.8px;white-space:pre-wrap;word-break:break-word;
      box-shadow:0 12px 40px rgba(0,0,0,0.3);text-align:center}

    /* Bulk plant panel (Shift+A) */
    #bulk-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      width:360px;max-height:80vh;background:radial-gradient(circle at 30% 20%,#fff3fb 0%,#f3d5ea 55%,#e8b8d8 100%);
      border:2px solid var(--bubble-edge);border-radius:22px;padding:18px;z-index:200;
      box-shadow:0 8px 32px rgba(0,0,0,0.25);overflow-y:auto;font-family:"Saint",sans-serif}
    #bulk-panel.show{display:block}
    #bulk-panel h3{margin:0 0 8px;font-size:16px;color:#7555a8;text-align:center;letter-spacing:2px}
    #bulk-panel textarea{width:calc(100% - 16px);height:180px;margin:0 0 10px;padding:8px;
      font-size:13px;border:2px solid var(--bubble-edge);border-radius:12px;resize:vertical;
      background:#fff8fc;color:#4a3060;font-family:"Saint",sans-serif;outline:none}
    #bulk-panel .hint{font-size:11px;color:#9a7bbb;margin:0 0 10px;text-align:center}
    #bulk-panel button{display:block;margin:0 auto;padding:8px 28px;font-size:14px;
      font-family:"Saint",sans-serif;color:#fff;background:linear-gradient(135deg,#c03870,#7555a8);
      border:none;border-radius:999px;cursor:pointer;letter-spacing:2px}
    #bulk-panel button:hover{opacity:0.85}
    #bulk-panel .close-x{position:absolute;top:8px;right:14px;font-size:20px;cursor:pointer;
      color:#7555a8;background:none;border:none;padding:4px}
    #admin-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      width:420px;max-height:80vh;background:radial-gradient(circle at 30% 20%,#fff3fb 0%,#f3d5ea 55%,#e8b8d8 100%);
      border:2px solid var(--bubble-edge);border-radius:22px;padding:18px;z-index:300;
      box-shadow:0 8px 32px rgba(0,0,0,0.25);overflow-y:auto;font-family:"Saint",sans-serif}
    #coin-counter{position:fixed;top:16px;left:16px;z-index:30;
      font-family:"GoldenGirdle","Saint","Trebuchet MS",sans-serif;font-size:22px;color:#d4c44e;
      text-shadow:0 0 8px rgba(212,196,78,0.5),0 2px 4px rgba(0,0,0,0.5);
      letter-spacing:2px;pointer-events:none;display:none;
      align-items:center;gap:6px}
    #coin-counter.show{display:flex}
    #coin-icon{width:28px;height:28px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#e8e0b0,#d4c44e 40%,#9a8030 100%);

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';

const W=()=>window.innerWidth, H=()=>window.innerHeight;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
let groundClip=null;

// ===== Dreamcore Pastel Palette =====
const PASTEL_PINK = ['#FFA6C9','#FFB7B2','#E8A0BF','#FFC8DD','#FFAFCC','#DB7093','#F08080'];
const PASTEL_PURPLE = ['#E6A8D7','#DDA0DD','#CDB4DB','#D7C0D0','#C08497'];
const PASTEL_BLUE = ['#B2D8D8','#B5E2FA','#A2D2FF','#BDE0FE'];
const PASTEL_SOFT = ['#F5D6D6','#FDFD96','#EAEAEA','#D3D3D3'];
const ALL_PASTEL = [...PASTEL_PINK,...PASTEL_PURPLE,...PASTEL_BLUE,...PASTEL_SOFT];

// ===== Independent RELETTER persistence =====
async function loadEntries(){await entryGate;return api('/api/entries',undefined,'GET');}
function saveEntry(text,username=''){
 const entry=plantEntries[plantEntries.length-1];const media=plantingMedia||{};plantingMedia=null;
 if(entry){entry.media={...media,username:selectedCharacter};if(media.parentId)attachReply(entry,media.parentId);}
 const payload={id:crypto.randomUUID(),text,part:{...media,username:selectedCharacter,position:entry?.mesh.position.toArray(),scale:entry?.mesh.scale.toArray(),rotation:entry?.mesh.rotation.z}};
 const persist=()=>api('/api/entries',payload).then(saved=>{if(entry){entry.entryId=saved.id;entry.ts=saved.created_at;if(searchPanel.classList.contains('show'))renderSearchList(searchInput.value);if(activeLabelEntry===entry)showMedia(entry);}}).catch(err=>{message('Save failed. Retrying in 5 seconds: '+err.message);setTimeout(persist,5000);});persist();
}
function deleteEntry(entryId){if(entryId)api('/api/entries/'+encodeURIComponent(entryId),undefined,'DELETE').catch(e=>message(e.message));}
// ===== Seeded Random =====
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)}return h>>>0}
function srand(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/0x100000000}}

// ===== L-System Core =====
const PLANT_RULES=[
  {axiom:'X',rules:{X:'F-[[X]+X]+F[+FX]-X',F:'FF'},angle:25,iters:5,step:0.22,width:0.055},
  {axiom:'F',rules:{F:'FF+[+F-F-F]-[-F+F+F]'},angle:22,iters:3,step:0.32,width:0.07},
  {axiom:'F',rules:{F:'F[+&F][-&F][&F]'},angle:25,iters:5,step:0.35,width:0.09},
  {axiom:'F',rules:{F:'F[+F]F[-F]F'},angle:25.7,iters:4,step:0.18,width:0.045},
  {axiom:'F',rules:{F:'FF-[-F+F]+[+F-F]'},angle:22,iters:4,step:0.28,width:0.065},
  {axiom:'X',rules:{X:'F[+X][-X]FX',F:'FF'},angle:28,iters:4,step:0.26,width:0.05},
  {axiom:'F',rules:{F:'F[+F[-F]]F[-F[+F]]'},angle:20,iters:4,step:0.24,width:0.06},
  {axiom:'F',rules:{F:'F[++F][-FF]F[+F][-F]'},angle:18,iters:3,step:0.35,width:0.08},
];

function lsysGen(axiom,rules,iters){
  let s=axiom;
  for(let i=0;i<iters;i++){
    let n='';for(const ch of s)n+=rules[ch]||ch;
    s=n;if(s.length>12000)break;
  }
  return s;
}

function interpretLS(str,cfg,rng){
  const segs=[],leaves=[],flowers=[];
  let pos=new THREE.Vector3(0,0,0);
  // Randomize initial growth direction per plant — not always straight up
  let hd=new THREE.Vector3((rng()-0.5)*0.4,1,(rng()-0.5)*0.4).normalize();
  let lt=new THREE.Vector3();
  if(Math.abs(hd.y)<0.9)lt.crossVectors(hd,new THREE.Vector3(0,1,0)).normalize();
  else lt.crossVectors(hd,new THREE.Vector3(1,0,0)).normalize();
  let up=new THREE.Vector3().crossVectors(lt,hd).normalize();
  let w=cfg.width,d=0,st=cfg.step;
  const stack=[];
  const rad=Math.PI/180;
  const MAX=600;

  for(const ch of str){
    if(segs.length>=MAX)break;
    const av=1+(rng()-0.5)*0.6;
    const a=cfg.angle*rad*av;
    switch(ch){
      case 'F':case 'G':{
        const s0=pos.clone();
        const tmpH=hd.clone();
        // 3D twist every segment
        tmpH.applyAxisAngle(lt,(rng()-0.5)*20*rad);
        tmpH.applyAxisAngle(up,(rng()-0.5)*20*rad);
        const curStep=st*(0.7+rng()*0.6);
        pos=pos.clone().addScaledVector(tmpH,curStep);
        segs.push({start:s0,end:pos.clone(),width:w,depth:d});
        break;
      }
      case '+':case '-':{
        // Yaw + forced random pitch to break planarity
        const sign=ch==='+'?1:-1;
        hd.applyAxisAngle(up,a*sign);lt.applyAxisAngle(up,a*sign);
        const pitchA=(rng()-0.5)*a*0.9;
        hd.applyAxisAngle(lt,pitchA);up.applyAxisAngle(lt,pitchA);
        break;
      }
      case '&':hd.applyAxisAngle(lt,a);up.applyAxisAngle(lt,a);break;
      case '^':hd.applyAxisAngle(lt,-a);up.applyAxisAngle(lt,-a);break;
      case '[':{
        stack.push({pos:pos.clone(),hd:hd.clone(),lt:lt.clone(),up:up.clone(),w,d,st});
        d++;w*=0.55;st*=0.78;
        // MASSIVE 3D randomization at every branch point
        const rollA=(rng()-0.5)*Math.PI; // ±90° roll
        lt.applyAxisAngle(hd,rollA);up.applyAxisAngle(hd,rollA);
        const pitchA=(rng()-0.5)*50*rad; // ±25° pitch
        hd.applyAxisAngle(lt,pitchA);up.applyAxisAngle(lt,pitchA);
        const yawA=(rng()-0.5)*40*rad; // ±20° yaw
        hd.applyAxisAngle(up,yawA);lt.applyAxisAngle(up,yawA);
        break;
      }
      case ']':{
        if(d>0&&rng()>0.2)leaves.push({p:pos.clone(),dir:hd.clone(),left:lt.clone()});
        if(d>1&&rng()>0.5)flowers.push({p:pos.clone(),dir:hd.clone()});
        const sv=stack.pop();
        if(!sv)break;
        pos=sv.pos;hd=sv.hd;lt=sv.lt;up=sv.up;w=sv.w;d=sv.d;st=sv.st;
        break;
      }
    }
  }
  if(segs.length>0)flowers.push({p:segs[segs.length-1].end.clone(),dir:hd.clone()});
  return{segs,leaves,flowers};
}

// ===== Root Generation =====
function genRoots(rng,baseW){
  const segs=[];
  const nR=3+Math.floor(rng()*4);
  for(let r=0;r<nR;r++){
    const ang=(r/nR)*Math.PI*2+rng()*0.5;
    const rLen=0.8+rng()*1.2;
    const nS=5+Math.floor(rng()*4);
    let pos=new THREE.Vector3(0,0,0);
    let dir=new THREE.Vector3(Math.cos(ang)*0.5,-0.85,Math.sin(ang)*0.5).normalize();
    let w=baseW*0.75;
    for(let i=0;i<nS;i++){
      const s=pos.clone();
      pos=pos.clone().addScaledVector(dir,rLen/nS);
      segs.push({start:s,end:pos.clone(),width:w,depth:0});
      w*=0.76;
      dir.x+=(rng()-0.5)*0.2;dir.y-=0.02;dir.z+=(rng()-0.5)*0.2;
      dir.normalize();
    }
    if(rng()>0.5){
      const splitI=Math.floor(segs.length*0.3+rng()*segs.length*0.3);
      const sp=segs[Math.min(splitI,segs.length-1)];
      let sP=sp.end.clone();
      let sD=new THREE.Vector3((rng()-0.5)*0.6,-0.5,(rng()-0.5)*0.6).normalize();
      let sW=sp.width*0.45;
      for(let i=0;i<3;i++){
        const ss=sP.clone();
        sP=sP.clone().addScaledVector(sD,rLen/nS*0.5);
        segs.push({start:ss,end:sP.clone(),width:sW,depth:1});
        sW*=0.7;
      }
    }
  }
  return segs;
}

// ===== Geometry Builder =====
function buildPlantGeo(allSegs,leaves,flowers,stemCol,leafCol,flowerCol,rng,caps=[],bigPetals=[]){
  const pos=[],nrm=[],col=[],idx=[];
  const RN=7; // more vertices for rounder, volumetric tubes

  function tube(start,end,w,cr,cg,cb){
    const dir=new THREE.Vector3().subVectors(end,start);
    if(dir.lengthSq()<0.0001)return;
    dir.normalize();
    const p1=new THREE.Vector3();
    if(Math.abs(dir.y)<0.9)p1.crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
    else p1.crossVectors(dir,new THREE.Vector3(1,0,0)).normalize();
    const p2=new THREE.Vector3().crossVectors(dir,p1);
    const bi=pos.length/3;
    const ew=w*0.8;
    for(let ring=0;ring<2;ring++){
      const c=ring===0?start:end;
      const r=ring===0?w:ew;
      for(let i=0;i<RN;i++){
        const a=(i/RN)*Math.PI*2,ca=Math.cos(a),sa=Math.sin(a);
        pos.push(c.x+(ca*p1.x+sa*p2.x)*r,c.y+(ca*p1.y+sa*p2.y)*r,c.z+(ca*p1.z+sa*p2.z)*r);
        nrm.push(ca*p1.x+sa*p2.x,ca*p1.y+sa*p2.y,ca*p1.z+sa*p2.z);
        col.push(cr,cg,cb);
      }
    }
    for(let i=0;i<RN;i++){
      const a0=bi+i,a1=bi+(i+1)%RN,b0=bi+RN+i,b1=bi+RN+(i+1)%RN;
      idx.push(a0,b0,a1,a1,b0,b1);
    }
  }

  // Stems — per-segment color shift for organic variety
  // ← 植物莖幹亮度：vary 範圍越高越亮（原 0.75~1.25，現 1.05~1.75）
  const sc=new THREE.Color(stemCol);
  for(const s of allSegs){
    const vary=1.05+rng()*0.3;
    const hShift=(rng()-0.5)*0.08;
    const c2=sc.clone().offsetHSL(hShift,0,(rng()-0.5)*0.15);
    tube(s.start,s.end,s.width,c2.r*vary,c2.g*vary,c2.b*vary);
  }

  // Leaves — 5 shape types, each randomly oriented in 3D
  // ← 植物葉片亮度：offsetHSL 第三個參數加 0.15 提亮（越大越亮）
  const lc=new THREE.Color(leafCol);
  for(const lf of leaves){
    const lv=lc.clone().offsetHSL((rng()-0.5)*0.15,0,(rng()-0.5)*0.12+0.01);
    const sz=0.15+rng()*0.35;
    const p=lf.p;
    // Fully random orientation — NOT aligned to branch
    const rAxis=new THREE.Vector3(rng()-0.5,rng()-0.5,rng()-0.5).normalize();
    const rAng=rng()*Math.PI*2;
    const fwd=lf.dir.clone().applyAxisAngle(rAxis,rAng).multiplyScalar(sz);
    const side=lf.left.clone().applyAxisAngle(rAxis,rAng).multiplyScalar(sz);
    const n=new THREE.Vector3().crossVectors(fwd,side).normalize();
    const lt=Math.floor(rng()*5);
    if(lt===0){ // Multi-segment curved frond
      let cp=p.clone();const segs=4+Math.floor(rng()*3),cv=(rng()-0.5)*0.6;
      for(let i=0;i<segs;i++){
        const t=i/segs,t2=(i+1)/segs;
        const w1=Math.sin(t*Math.PI)*sz*0.4,w2=Math.sin(t2*Math.PI)*sz*0.4;
        const bi=pos.length/3;
        const cp2=cp.clone().addScaledVector(fwd,1/segs).addScaledVector(side,cv/segs*Math.sin(t*Math.PI));
        pos.push(cp.x+side.x*w1/sz,cp.y+side.y*w1/sz,cp.z+side.z*w1/sz);
        pos.push(cp.x-side.x*w1/sz,cp.y-side.y*w1/sz,cp.z-side.z*w1/sz);
        pos.push(cp2.x+side.x*w2/sz,cp2.y+side.y*w2/sz,cp2.z+side.z*w2/sz);
        pos.push(cp2.x-side.x*w2/sz,cp2.y-side.y*w2/sz,cp2.z-side.z*w2/sz);
        for(let j=0;j<4;j++){nrm.push(n.x,n.y,n.z);col.push(lv.r,lv.g,lv.b)}
        idx.push(bi,bi+2,bi+1,bi+1,bi+2,bi+3);cp.copy(cp2);
      }
    }else if(lt===1){ // Star spikes
      const nSp=3+Math.floor(rng()*4),bi=pos.length/3;
      pos.push(p.x,p.y,p.z);nrm.push(n.x,n.y,n.z);col.push(lv.r,lv.g,lv.b);
      for(let i=0;i<nSp;i++){
        const a=(i/nSp)*Math.PI*2+rng()*0.5,sL=sz*(0.5+rng()*0.5);
        const dx=Math.cos(a)*fwd.x/sz+Math.sin(a)*side.x/sz;
        const dy=Math.cos(a)*fwd.y/sz+Math.sin(a)*side.y/sz;
        const dz=Math.cos(a)*fwd.z/sz+Math.sin(a)*side.z/sz;
        pos.push(p.x+dx*sL,p.y+dy*sL,p.z+dz*sL);
        nrm.push(n.x,n.y,n.z);col.push(lv.r*0.9,lv.g*0.9,lv.b*0.9);
        if(i<nSp-1)idx.push(bi,bi+1+i,bi+2+i);
        else idx.push(bi,bi+1+i,bi+1);
      }
    }else if(lt===2){ // Round pad fan
      const nSg=6+Math.floor(rng()*4),bi=pos.length/3;
      pos.push(p.x,p.y,p.z);nrm.push(n.x,n.y,n.z);col.push(lv.r,lv.g,lv.b);
      for(let i=0;i<=nSg;i++){
        const a=(i/nSg)*Math.PI*2;
        pos.push(p.x+Math.cos(a)*fwd.x*0.5+Math.sin(a)*side.x*0.5,
                 p.y+Math.cos(a)*fwd.y*0.5+Math.sin(a)*side.y*0.5,
                 p.z+Math.cos(a)*fwd.z*0.5+Math.sin(a)*side.z*0.5);
        nrm.push(n.x,n.y,n.z);col.push(lv.r,lv.g,lv.b);
        if(i>0)idx.push(bi,bi+i,bi+i+1);
      }
    }else if(lt===3){ // Curling tendril
      let cp=p.clone();const tS=5+Math.floor(rng()*3),cR=sz*0.3;
      for(let i=0;i<tS;i++){
        const t=i/tS,a=t*Math.PI*3,r=cR*(1-t*0.5);
        const nx2=new THREE.Vector3(Math.cos(a)*fwd.x/sz+fwd.x*t/sz,
          Math.cos(a)*fwd.y/sz+fwd.y*t/sz+Math.sin(a)*r,
          Math.cos(a)*fwd.z/sz+fwd.z*t/sz).multiplyScalar(sz/tS);
        const nxt=cp.clone().add(nx2);
        const bi=pos.length/3,w2=0.03+0.02*(1-t);
        pos.push(cp.x+n.x*w2,cp.y+n.y*w2,cp.z+n.z*w2);
        pos.push(cp.x-n.x*w2,cp.y-n.y*w2,cp.z-n.z*w2);
        pos.push(nxt.x+n.x*w2,nxt.y+n.y*w2,nxt.z+n.z*w2);
        pos.push(nxt.x-n.x*w2,nxt.y-n.y*w2,nxt.z-n.z*w2);
        for(let j=0;j<4;j++){nrm.push(n.x,n.y,n.z);col.push(lv.r,lv.g,lv.b)}
        idx.push(bi,bi+2,bi+1,bi+1,bi+2,bi+3);cp.copy(nxt);
      }
    }else{ // Wide multi-row tropical
      const rows=3+Math.floor(rng()*3);
      for(let r=0;r<rows;r++){
        const t=r/rows,t2=(r+1)/rows;
        const w1=Math.sin(t*Math.PI)*sz*0.6,w2=Math.sin(t2*Math.PI)*sz*0.6;
        const bi=pos.length/3;
        const c1=p.clone().addScaledVector(fwd,t/rows);
        const c2=p.clone().addScaledVector(fwd,(t+1/rows)/rows);
        pos.push(c1.x-side.x*w1/sz,c1.y-side.y*w1/sz,c1.z-side.z*w1/sz);
        pos.push(c1.x,c1.y+rng()*0.03,c1.z);
        pos.push(c1.x+side.x*w1/sz,c1.y+side.y*w1/sz,c1.z+side.z*w1/sz);
        pos.push(c2.x-side.x*w2/sz,c2.y-side.y*w2/sz,c2.z-side.z*w2/sz);
        pos.push(c2.x,c2.y+rng()*0.03,c2.z);
        pos.push(c2.x+side.x*w2/sz,c2.y+side.y*w2/sz,c2.z+side.z*w2/sz);
        for(let j=0;j<6;j++){nrm.push(n.x,n.y,n.z);col.push(lv.r,lv.g,lv.b)}
        idx.push(bi,bi+3,bi+1,bi+1,bi+3,bi+4,bi+1,bi+4,bi+2,bi+2,bi+4,bi+5);
      }
    }
  }

  // Flowers — 3D shapes (sphere burst, rosette, dandelion)
  // ← 植物花朵亮度：offsetHSL 第三個參數加 0.15 提亮
  const fc=new THREE.Color(flowerCol);
  for(const fl of flowers){
    const fv=fc.clone().offsetHSL((rng()-0.5)*0.2,0,(rng()-0.5)*0.1+0.01);
    const fSz=0.12+rng()*0.25;
    const c=fl.p;
    const nP=5+Math.floor(rng()*6);
    const ft=Math.floor(rng()*3);
    if(ft===0){ // Spherical petal burst
      for(let i=0;i<nP;i++){
        const phi=Math.acos(2*rng()-1),theta=rng()*Math.PI*2;
        const dx=Math.sin(phi)*Math.cos(theta),dy=Math.cos(phi)*0.5+0.5,dz=Math.sin(phi)*Math.sin(theta);
        const bi=pos.length/3;
        const tx=c.x+dx*fSz,ty=c.y+dy*fSz,tz=c.z+dz*fSz;
        const pw=fSz*0.25,px=-dz,pz=dx;
        pos.push(c.x,c.y,c.z);pos.push(tx+px*pw,ty,tz+pz*pw);pos.push(tx-px*pw,ty,tz-pz*pw);
        for(let j=0;j<3;j++){nrm.push(dx,dy,dz);col.push(fv.r,fv.g,fv.b)}
        idx.push(bi,bi+1,bi+2);
      }
    }else if(ft===1){ // Layered rosette
      for(let lay=0;lay<3;lay++){
        const lr=fSz*(0.3+lay*0.25),ly=lay*0.04,ln=4+lay*2;
        for(let i=0;i<ln;i++){
          const a1=(i/ln)*Math.PI*2+lay*0.3,a2=((i+1)/ln)*Math.PI*2+lay*0.3;
          const bi=pos.length/3;
          pos.push(c.x,c.y+ly+0.02,c.z);
          pos.push(c.x+Math.cos(a1)*lr,c.y+ly,c.z+Math.sin(a1)*lr);
          pos.push(c.x+Math.cos(a2)*lr,c.y+ly,c.z+Math.sin(a2)*lr);
          for(let j=0;j<3;j++){nrm.push(0,1,0);col.push(fv.r*(1-lay*0.08),fv.g*(1-lay*0.08),fv.b*(1-lay*0.08))}
          idx.push(bi,bi+1,bi+2);
        }
      }
    }else{ // Dandelion puff spikes
      for(let i=0;i<nP*2;i++){
        const phi=Math.acos(2*rng()-1),theta=rng()*Math.PI*2;
        const dx=Math.sin(phi)*Math.cos(theta),dy=Math.cos(phi),dz=Math.sin(phi)*Math.sin(theta);
        const bi=pos.length/3;
        const sl=fSz*(0.5+rng()*0.5);
        const tx=c.x+dx*sl,ty=c.y+dy*sl,tz=c.z+dz*sl;
        pos.push(c.x,c.y,c.z);pos.push(tx+0.01,ty,tz);pos.push(tx,ty+0.01,tz+0.01);
        for(let j=0;j<3;j++){nrm.push(dx,dy,dz);col.push(fv.r*1.3,fv.g*1.3,fv.b*1.3)}
        idx.push(bi,bi+1,bi+2);
      }
    }
  }

  // Mushroom caps — hemisphere dome
  for(const cap of caps){
    const cc=new THREE.Color(flowerCol);
    const ct=cap.center,cr=cap.radius,ch=cap.height;
    const cRings=8,cSegs=14;
    const capBase=pos.length/3;
    for(let ring=0;ring<=cRings;ring++){
      const t=ring/cRings;
      const ringR=Math.sin(t*Math.PI*0.52)*cr;
      const ringY=ct.y+Math.cos(t*Math.PI*0.52)*ch;
      for(let s=0;s<cSegs;s++){
        const a=(s/cSegs)*Math.PI*2;
        pos.push(ct.x+Math.cos(a)*ringR,ringY,ct.z+Math.sin(a)*ringR);
        const nx=Math.cos(a)*Math.sin(t*Math.PI*0.52),ny=Math.cos(t*Math.PI*0.52),nz=Math.sin(a)*Math.sin(t*Math.PI*0.52);
        nrm.push(nx,ny,nz);
        const cv=cc.clone().offsetHSL((rng()-0.5)*0.06,0,t*0.15-(rng()-0.5)*0.05);
        col.push(cv.r,cv.g,cv.b);
      }
    }
    for(let ring=0;ring<cRings;ring++){
      for(let s=0;s<cSegs;s++){
        const a=capBase+ring*cSegs+s,b=capBase+ring*cSegs+(s+1)%cSegs;
        const c2=capBase+(ring+1)*cSegs+s,d=capBase+(ring+1)*cSegs+(s+1)%cSegs;
        idx.push(a,c2,b,b,c2,d);
      }
    }
    // Underside gills — ring of triangles under cap
    const gillC=cc.clone().offsetHSL(0.05,0,-0.15);
    const gillY=ct.y-ch*0.1;
    const gillBi=pos.length/3;
    pos.push(ct.x,gillY,ct.z);nrm.push(0,-1,0);col.push(gillC.r,gillC.g,gillC.b);
    for(let s=0;s<=cSegs;s++){
      const a=(s/cSegs)*Math.PI*2;
      pos.push(ct.x+Math.cos(a)*cr*0.95,gillY,ct.z+Math.sin(a)*cr*0.95);
      nrm.push(0,-1,0);col.push(gillC.r*0.85,gillC.g*0.85,gillC.b*0.85);
      if(s>0)idx.push(gillBi,gillBi+s,gillBi+s+1);
    }
  }

  // Big flower petals — large curved petals radiating from center
  for(const bp of bigPetals){
    const pc=new THREE.Color(flowerCol);
    const ct=bp.center,sz=bp.size,nP=bp.nPetals;
    for(let i=0;i<nP;i++){
      const a=(i/nP)*Math.PI*2+rng()*0.3;
      const pv=pc.clone().offsetHSL((rng()-0.5)*0.12,0,(rng()-0.5)*0.1);
      // Each petal = 3 quads forming a curved petal
      for(let seg=0;seg<3;seg++){
        const t1=seg/3,t2=(seg+1)/3;
        const r1=sz*0.15+t1*sz*0.85,r2=sz*0.15+t2*sz*0.85;
        const w1=Math.sin(t1*Math.PI)*sz*0.35,w2=Math.sin(t2*Math.PI)*sz*0.35;
        const y1=ct.y+Math.sin(t1*Math.PI*0.6)*sz*0.3,y2=ct.y+Math.sin(t2*Math.PI*0.6)*sz*0.3;
        const bi=pos.length/3;
        const aL=a-0.15,aR=a+0.15;
        pos.push(ct.x+Math.cos(aL)*r1,y1,ct.z+Math.sin(aL)*r1);
        pos.push(ct.x+Math.cos(aR)*r1,y1,ct.z+Math.sin(aR)*r1);
        pos.push(ct.x+Math.cos(aL)*r2,y2,ct.z+Math.sin(aL)*r2);
        pos.push(ct.x+Math.cos(aR)*r2,y2,ct.z+Math.sin(aR)*r2);
        for(let j=0;j<4;j++){nrm.push(0,1,0);col.push(pv.r*(1-seg*0.08),pv.g*(1-seg*0.08),pv.b*(1-seg*0.08))}
        idx.push(bi,bi+2,bi+1,bi+1,bi+2,bi+3);
      }
    }
    // Center pistil sphere
    const pistC=pc.clone().offsetHSL(0.1,0,0.1);
    const pistBi=pos.length/3;
    const pistR=sz*0.12;
    pos.push(ct.x,ct.y+pistR,ct.z);nrm.push(0,1,0);col.push(pistC.r,pistC.g,pistC.b);
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2;
      pos.push(ct.x+Math.cos(a)*pistR,ct.y+0.01,ct.z+Math.sin(a)*pistR);
      nrm.push(0,1,0);col.push(pistC.r*0.9,pistC.g*0.9,pistC.b*0.9);
      if(i>0)idx.push(pistBi,pistBi+i,pistBi+i+1);
    }
    idx.push(pistBi,pistBi+8,pistBi+1);
  }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx);

  // Sort triangles by Y for growth animation (bottom->top)
  const posArr=geo.getAttribute('position').array;
  const idxArr=Array.from(geo.getIndex().array);
  const tc=idxArr.length/3;
  const tris=[];
  for(let i=0;i<tc;i++){
    const a=idxArr[i*3],b=idxArr[i*3+1],c=idxArr[i*3+2];
    tris.push({a,b,c,y:(posArr[a*3+1]+posArr[b*3+1]+posArr[c*3+1])/3});
  }
  tris.sort((a,b)=>a.y-b.y);
  const sorted=[];
  for(const t of tris)sorted.push(t.a,t.b,t.c);
  geo.setIndex(sorted);

  return geo;
}

// ===== Generate Plant — 8 distinct types =====
function makePlant(text){
  const opts=(arguments.length>1&&arguments[1])?arguments[1]:{};
  const clipBelow=opts.clipBelow!==undefined?opts.clipBelow:true;
  const seed=hash(text);
  const rng=srand(seed);
  let plantType=seed%8;
  // 0-1:tree, 2:fern, 3:mushroom, 4:big flower, 5:vine, 6:coral, 7:cactus

  let segs=[],leaves=[],flowers=[],caps=[],bigPetals=[];
  const stemCol=ALL_PASTEL[Math.floor(rng()*ALL_PASTEL.length)];
  const leafCol=ALL_PASTEL[Math.floor(rng()*ALL_PASTEL.length)];
  const flowerCol=ALL_PASTEL[Math.floor(rng()*ALL_PASTEL.length)];
  let plantH=3; // estimated height for stacking

  if(plantType<=2){ // Tree or Fern (L-System)
    const ri=Math.floor(rng()*PLANT_RULES.length);
    const type=PLANT_RULES[ri];
    const iterVar=Math.max(2,type.iters+Math.floor(rng()*3)-1);
    const modType={
      ...type,
      angle:type.angle*(0.4+rng()*1.2),
      step:type.step*(0.3+rng()*1.4),
      width:type.width*(0.8+rng()*2.0),
      iters:iterVar
    };
    const lStr=lsysGen(modType.axiom,modType.rules,modType.iters);
    const r=interpretLS(lStr,modType,rng);
    segs=[...genRoots(rng,modType.width),...r.segs];leaves=r.leaves;flowers=r.flowers;
    plantH=modType.step*modType.iters*3;
  }else if(plantType===3){ // MUSHROOM — short stalk + dome cap
    const stalkH=0.3+rng()*2.0,stalkW=0.06+rng()*0.25,stalkN=2+Math.floor(rng()*6);
    let cx=0,cy=0,cz=0;
    for(let i=0;i<stalkN;i++){
      const t=i/stalkN;
      const nx=cx+(rng()-0.5)*0.08,ny=cy+stalkH/stalkN,nz=cz+(rng()-0.5)*0.08;
      segs.push({start:new THREE.Vector3(cx,cy,cz),end:new THREE.Vector3(nx,ny,nz),width:stalkW*(1-t*0.15),depth:0});
      cx=nx;cy=ny;cz=nz;
    }
    caps.push({center:new THREE.Vector3(cx,cy,cz),radius:0.15+rng()*0.8,height:0.08+rng()*0.35});
    // Sometimes add extra smaller caps on stalk
    if(rng()>0.5&&segs.length>2){const si=Math.floor(rng()*segs.length);const sp=segs[si].end;caps.push({center:sp.clone().add(new THREE.Vector3(0,0.05,0)),radius:0.1+rng()*0.3,height:0.06+rng()*0.15})}
    segs=[...genRoots(rng,stalkW*0.4),...segs];
    plantH=stalkH+0.3;
  }else if(plantType===4){ // BIG FLOWER — tall stem + huge petals
    const stemH=0.8+rng()*4,stemW=0.03+rng()*0.08,stemN=5+Math.floor(rng()*10);
    let cx=0,cy=0,cz=0;const cv=(rng()-0.5)*0.3;
    for(let i=0;i<stemN;i++){
      const t=i/stemN;
      const nx=cx+Math.sin(t*Math.PI)*cv*0.2,ny=cy+stemH/stemN,nz=cz+Math.cos(t*Math.PI*0.7)*cv*0.2;
      segs.push({start:new THREE.Vector3(cx,cy,cz),end:new THREE.Vector3(nx,ny,nz),width:stemW*(1-t*0.3),depth:0});
      cx=nx;cy=ny;cz=nz;
      if(rng()>0.7)leaves.push({p:new THREE.Vector3(cx,cy,cz),dir:new THREE.Vector3(rng()-0.5,0.5,rng()-0.5).normalize(),left:new THREE.Vector3(rng()-0.5,0,rng()-0.5).normalize()});
    }
    bigPetals.push({center:new THREE.Vector3(cx,cy,cz),size:0.2+rng()*1.2,nPetals:3+Math.floor(rng()*10)});
    segs=[...genRoots(rng,stemW*0.5),...segs];
    plantH=stemH;
  }else if(plantType===5){ // VINE — thin winding
    const type=PLANT_RULES[Math.floor(rng()*PLANT_RULES.length)];
    const iterVar=Math.max(2,type.iters+Math.floor(rng()*2)-1);
    const modType={...type,angle:type.angle*(0.5+rng()*1.0),step:type.step*(0.3+rng()*0.6),width:type.width*(0.3+rng()*0.5),iters:iterVar};
    const lStr=lsysGen(modType.axiom,modType.rules,modType.iters);
    const r=interpretLS(lStr,modType,rng);
    segs=r.segs;leaves=r.leaves;flowers=r.flowers;
    plantH=modType.step*modType.iters*2;
  }else if(plantType===6){ // CORAL — dense branching, no leaves, vivid
    const type=PLANT_RULES[Math.floor(rng()*PLANT_RULES.length)];
    const iterVar=Math.max(2,type.iters+Math.floor(rng()*2));
    const modType={...type,angle:type.angle*(0.6+rng()*1.2),step:type.step*(0.3+rng()*0.8),width:type.width*(1.0+rng()*2.5),iters:iterVar};
    const lStr=lsysGen(modType.axiom,modType.rules,modType.iters);
    const r=interpretLS(lStr,modType,rng);
    segs=r.segs;flowers=r.flowers; // no leaves for coral
    plantH=modType.step*modType.iters*2;
  }else{ // CACTUS — thick segments with spikes
    const bodyH=0.5+rng()*2.5,bodyW=0.1+rng()*0.35,bodyN=3+Math.floor(rng()*6);
    let cx=0,cy=0,cz=0;
    for(let i=0;i<bodyN;i++){
      const t=i/bodyN;
      const nx=cx+(rng()-0.5)*0.05,ny=cy+bodyH/bodyN,nz=cz+(rng()-0.5)*0.05;
      segs.push({start:new THREE.Vector3(cx,cy,cz),end:new THREE.Vector3(nx,ny,nz),width:bodyW*(1-t*0.1),depth:0});
      cx=nx;cy=ny;cz=nz;
    }
    // Arms
    const nArms=1+Math.floor(rng()*3);
    for(let a=0;a<nArms;a++){
      const aIdx=Math.floor((0.3+rng()*0.4)*segs.length);
      const ap=segs[Math.min(aIdx,segs.length-1)].end.clone();
      const aDir=new THREE.Vector3((rng()-0.5)*2,0.5+rng()*0.5,(rng()-0.5)*2).normalize();
      let ax=ap.x,ay=ap.y,az=ap.z;
      for(let i=0;i<3;i++){
        const nx=ax+aDir.x*0.3,ny=ay+aDir.y*0.3,nz=az+aDir.z*0.3;
        segs.push({start:new THREE.Vector3(ax,ay,az),end:new THREE.Vector3(nx,ny,nz),width:bodyW*0.6*(1-i*0.2),depth:1});
        ax=nx;ay=ny;az=nz;
      }
    }
    // Flowers on top
    flowers.push({p:new THREE.Vector3(cx,cy,cz),dir:new THREE.Vector3(0,1,0)});
    segs=[...genRoots(rng,bodyW*0.3),...segs];
    plantH=bodyH;
  }

  const geo=buildPlantGeo(segs,leaves,flowers,stemCol,leafCol,flowerCol,rng,caps,bigPetals);
  const emissiveCol=new THREE.Color(ALL_PASTEL[Math.floor(rng()*ALL_PASTEL.length)]);
  const mat=new THREE.MeshStandardMaterial({
    vertexColors:true,roughness:0.6,metalness:0.05,
    // ← 植物自發光強度：越大越亮（原 0.15，現 0.35）
    emissive:emissiveCol,emissiveIntensity:0.35,
    side:THREE.DoubleSide,
    envMapIntensity:0
  });
  if(clipBelow&&groundClip){
    mat.clippingPlanes=[groundClip];
  }
  const mesh=new THREE.Mesh(geo,mat);
  mesh.userData.entryText=text;
  mesh.userData.totalIdx=geo.getIndex().count;
  mesh.userData.plantH=plantH;
  const grp=new THREE.Group();
  grp.rotation.set((rng()-0.5)*0.3,rng()*Math.PI*2,(rng()-0.5)*0.2);
  const sc=0.6+rng()*0.8;
  grp.scale.set(sc,sc,sc);
  grp.add(mesh);
  return grp;
}

    const wr=parseInt(white.slice(1,3),16),wg=parseInt(white.slice(3,5),16),wb=parseInt(white.slice(5,7),16);

// ===== VHS Filter (Shift+V toggle) =====
const VHSShader={
  uniforms:{
    tDiffuse:{value:null},
    time:{value:0},
    intensity:{value:1.0},
    resolution:{value:new THREE.Vector2(W(),H())},
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}
  `,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float time;
    uniform float intensity;
    uniform vec2 resolution;
    varying vec2 vUv;

    float rand(vec2 co){return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453);}

    void main(){
      vec2 uv=vUv;

      // === 波浪扭曲（慢） ===
      // 12.0=波浪密度（越大波紋越密）  2.5=晃動速度  0.0021=扭曲幅度（越大越歪）
      float wave=sin(uv.y*12.0+time*2.5)*0.0021*intensity;
      // === 波浪扭曲（快） ===
      // 35.0=高頻密度  4.0=速度  0.0021=振幅（細微抖動）
      wave+=sin(uv.y*35.0+time*4.0)*0.0021*intensity;
      // === 故障橫帶 ===
      // 0.95=觸發門檻（越低越頻繁出現）  0.015=橫移量（越大偏移越大）
      float band=step(0.98,sin(time*0.7+uv.y*3.0))*0.0005*intensity;
      uv.x+=wave+band;

      // === 垂直抖動（整個畫面上下微跳） ===
      // 13.0=跳動速度  0.0008=跳動幅度
      uv.y+=sin(time*13.0)*0.0008*intensity;

      // === 色差分離（RGB頻道錯位） ===
      // 0.002=偏移量（越大彩色邊緣越明顯，0=關閉）
      float shift=0.00002*intensity;
      float r=texture2D(tDiffuse,vec2(uv.x+shift,uv.y)).r;
      float g=texture2D(tDiffuse,uv).g;
      float b=texture2D(tDiffuse,vec2(uv.x-shift,uv.y)).b;
      vec3 col=vec3(r,g,b);

      // === 掃描線（水平條紋） ===
      // 1.2=線條密度  0.02=線條深度（越大越明顯，0=關閉）
      float scanline=sin(vUv.y*resolution.y*1.2)*0.012*intensity;
      col-=scanline;

      // === 靜態雜訊（雪花點） ===
      // 0.04=雜訊強度（越大雪花越多，0=關閉）
      float noise=(rand(vUv*time)-0.5)*0.04*intensity;
      col+=noise;

      // === 暗角（畫面邊緣變暗） ===
      // 1.1=暗角範圍（越大邊緣越暗）  0.10=暗角強度（0=關閉）
      float vig=1.0-dot((vUv-0.5)*1.1,(vUv-0.5)*1.1);
      col*=mix(1.0,vig,0.0*intensity);

      // === 去飽和（褪色感） ===
      // 1.0=全彩  0.85=微褪色  0.0=全黑白
      float lum=dot(col,vec3(0.299,0.587,0.114));
      col=mix(vec3(lum),col,0.7);

      // === 亮度補償 ===
      // 1.35=補回被掃描線/雜訊吃掉的亮度（1.0=不補  越大越亮）
      col*=2.0;

      gl_FragColor=vec4(col,1.0);
    }
  `
};

async function loadChar(){
  let gltf=null;
  try{
    if('caches' in window){
      const cache=await caches.open('ul-assets-v1');
      let resp=await cache.match('character.glb');
      if(!resp){
        resp=await fetch('character.glb',{cache:'force-cache'});
        if(resp&&resp.ok)cache.put('character.glb',resp.clone());
      }
      if(resp&&resp.ok){
        const buf=await resp.arrayBuffer();
        gltf=await new Promise((res,rej)=>loader.parse(buf,'',res,rej));
      }
    }
  }catch{}
  if(!gltf)gltf=await loader.loadAsync('character.glb');
  charModel=gltf.scene;
  charModel.rotation.y=0; // model visual face is +Z; camera at +Z side
  charModel.scale.setScalar(100); // Mixamo FBX→Blender applies 0.01 scale — undo it
  charModel.position.y=CHAR_Y_OFFSET; // raise above platform surface
  charModel.updateMatrixWorld(true);
  { // Auto-adjust base Y so feet sit on platform
    const box=new THREE.Box3().setFromObject(charModel);
    charHalfHeight=(box.max.y-box.min.y)*0.5;
    baseModelY=CHAR_Y_OFFSET-box.min.y+FOOT_LIFT;
    charModel.position.y=baseModelY;
  }

  // Keep original textures — only disable frustum culling
  charModel.traverse(o=>{
    if(o.isMesh){
      o.frustumCulled=false;
      if(o.material){
        o.material.side=THREE.DoubleSide;
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for(const m of mats){
          if(m.color){
            const hsl={h:0,s:0,l:0};m.color.getHSL(hsl);
            m.color.setHSL(hsl.h,hsl.s*0.5,hsl.l);
          }
          if(m.emissive){
            const hslE={h:0,s:0,l:0};m.emissive.getHSL(hslE);
            m.emissive.setHSL(hslE.h,hslE.s*0.5,hslE.l);
          }
          if('envMapIntensity' in m)m.envMapIntensity=0.6;
          charMats.push({
            mat:m,
            baseEmissive:m.emissive?m.emissive.clone():null,
            baseEmissiveIntensity:('emissiveIntensity' in m)?m.emissiveIntensity:0
          });
        }
      }
    }
  });
  // Lock root bone translation to prevent animation root-motion drift
  charModel.traverse(o=>{
    if(rootBone||!o.isSkinnedMesh||!o.skeleton)return;
    const bones=o.skeleton.bones||[];
    rootBone=bones.find(b=>/hips|root/i.test(b.name))||bones[0]||null;
    if(rootBone)rootBoneBase=rootBone.position.clone();
  });
  charRoot.add(charModel);

  // Find animations by name
  mixer=new THREE.AnimationMixer(charModel);
  for(const clip of gltf.animations){
    stripRootMotion(clip);
    const n=clip.name.toLowerCase();
    if(n==='idle')clipIdle=clip;
    else if(n==='drink')clipDrink=clip;
    else if(n==='walk')clipWalk=clip;
    else if(n==='run'||n==='running')clipRun=clip;
    else if(n==='jump')clipJump=clip;
    else if(n==='fall')clipFall=clip;
  }

  // Start idle
  console.log('Animations found:',gltf.animations.map(c=>c.name),'idle:',!!clipIdle,'drink:',!!clipDrink,'walk:',!!clipWalk,'run:',!!clipRun,'jump:',!!clipJump,'fall:',!!clipFall);
  if(clipIdle){actIdle=mixer.clipAction(clipIdle);actIdle.play()}
  charReady=true;
  if(pendingStartText&&clipDrink&&mixer){
    const t=pendingStartText;
    const u=firstUsername;
    pendingStartText=null;
    startCinematic(t,u);
  }
}

const MONSTER_COUNT=1;
const MONSTER_ACCEL_DIST=8.0; // distance to player at which monster accelerates
const MONSTER_HIT_DIST=2.5;  // collision distance (larger model)
const MONSTER_HIT_COOLDOWN=1.5; // seconds between hits
const MONSTER_SCALE=4000; // 30x larger than 1000
const MONSTER_Y=0; // ← 手動調整怪物高度：正數往上，負數往下
// Per-monster speed & behavior profiles (speeds halved)
const MONSTER_PROFILES=[
  {normalSpeed:1.25, chaseSpeed:4.5,  pattern:'direct',  spawnDist:40},
  {normalSpeed:2.5,  chaseSpeed:7.0,  pattern:'zigzag',  spawnDist:55},
  {normalSpeed:1.75, chaseSpeed:5.5,  pattern:'flank',   spawnDist:45},
];
let monstersActive=false; // activated by Return key
const monsters=[];
let monsterWalkClip=null,monsterChaseClip=null;
let monstersLoaded=false;

// Player hit effect state
let playerHitTimer=-1;
const PLAYER_HIT_DURATION=0.6;
let playerShakeOffset=new THREE.Vector3();

async function loadMonsters(){
  console.log('[Monster] Starting load...');
  try{
    // Load monster GLB with cache
    let gltf=null;
    try{
      if('caches' in window){
        const cache=await caches.open('ul-assets-v1');
        let resp=await cache.match('monster.glb');
        if(!resp){
          resp=await fetch('monster.glb');
          if(resp&&resp.ok) cache.put('monster.glb',resp.clone());
        }
        if(resp&&resp.ok){
          const buf=await resp.arrayBuffer();
          gltf=await new Promise((res,rej)=>loader.parse(buf,'',res,rej));
        }
      }
    }catch(ce){console.warn('[Monster] cache err:',ce)}
    if(!gltf) gltf=await loader.loadAsync('monster.glb');
    console.log('[Monster] GLB loaded, scene children:',gltf.scene.children.length,'animations:',gltf.animations.length);

    // Find animations by name
    for(const clip of gltf.animations){
      const n=clip.name.toLowerCase();
      console.log('[Monster] Found animation:',clip.name);
      if(n.includes('walk'))monsterWalkClip=clip;
      if(n.includes('chase'))monsterChaseClip=clip;
    }

    // Spawn positions — spread around at different angles
    const spawnAngles=[0, Math.PI*2/3, Math.PI*4/3];

    // Clone materials from original so each clone gets its own copy
    const origMats=[];
    gltf.scene.traverse(o=>{
      if(o.isMesh&&o.material) origMats.push(o.material);
    });

    for(let i=0;i<MONSTER_COUNT;i++){
      const prof=MONSTER_PROFILES[i];
      const model=SkeletonUtils.clone(gltf.scene);
      model.scale.setScalar(MONSTER_SCALE);

      // Fix materials — clone from original to restore textures
      let matIdx=0;
      model.traverse(o=>{
        if(o.isMesh){
          o.frustumCulled=false;
          if(origMats[matIdx]){
            o.material=origMats[matIdx].clone();
            o.material.side=THREE.DoubleSide;
            o.material.needsUpdate=true;
          }
          matIdx++;
        }
      });

      const root=new THREE.Group();
      model.position.y=0;
      root.add(model);
      root.position.y=MONSTER_Y;

      const ang=spawnAngles[i];
      const spawnX=Math.cos(ang)*prof.spawnDist;
      const spawnZ=Math.sin(ang)*prof.spawnDist;
      root.position.set(spawnX,MONSTER_Y,spawnZ);
      root.visible=false; // Await the authoritative room snapshot before showing the monster.
      scene.add(root);

      // Create animation mixer
      const mMixer=new THREE.AnimationMixer(model);
      let walkAction=null,chaseAction=null;

      if(monsterWalkClip){
        walkAction=mMixer.clipAction(monsterWalkClip);
        walkAction.setLoop(THREE.LoopRepeat);
        walkAction.timeScale=0.8+i*0.3;
        walkAction.play();
      }
      if(monsterChaseClip){
        chaseAction=mMixer.clipAction(monsterChaseClip);
        chaseAction.setLoop(THREE.LoopRepeat);
        chaseAction.timeScale=0.9+i*0.2;
      }

      monsters.push({
        root,
        model,
        mixer:mMixer,
        walkAction,
        chaseAction,
        isChasing:false,
        speed:prof.normalSpeed,
        normalSpeed:prof.normalSpeed,
        chaseSpeed:prof.chaseSpeed,
        pattern:prof.pattern,
        hitCooldown:0,
        basePos:new THREE.Vector3(spawnX,0,spawnZ),
        patternTimer:Math.random()*Math.PI*2,
      });
    }
    monstersLoaded=true;
    monstersActive=true; // auto-activate immediately
    console.log('[Monster] All loaded and active! Count:',MONSTER_COUNT);
  }catch(e){
    console.error('[Monster] Load error:',e);
  }
}
