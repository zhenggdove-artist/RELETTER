// ===== Coin System (金幣收集) =====
const COIN_FLOAT_HEIGHT=1.8; // ← 金幣懸浮在平台上方的高度（跳躍高峰約2.0）
const COIN_SCALE=1.6; // ← 金幣模型大小（原8.0的五分之一）
const COIN_HIT_DIST=1.5; // ← 碰撞半徑
const COIN_RESPAWN_TIME=10.0; // ← 金幣重生秒數
const coins=[];
let coinCount=0;
let coinTemplate=null;
let coinsLoaded=false;
let coinsVisible=false;

function createCollectibleCoin(){if(!coinTemplate)return null;const model=coinTemplate.clone();model.scale.setScalar(COIN_SCALE);return model;}

async function loadCoins(){
  try{
    const gltf=await loader.loadAsync('playermodel/COIN/coin_small.glb');
    coinTemplate=gltf.scene;
    coinTemplate.traverse(o=>{
      if(o.isMesh){
        o.frustumCulled=false;
        if(o.material){
          o.material=o.material.clone();
          o.material.side=THREE.DoubleSide;
          o.material.metalness=0.8;
          o.material.roughness=0.2;
          o.material.emissive=new THREE.Color('#FFD700');
          o.material.emissiveIntensity=0.3;
        }
      }
    });
    // Place a coin above ~1/3 of sky platforms randomly
    for(const sp of skyPlats){
      if(Math.random()>0.33) continue; // skip ~2/3 of platforms
      const coinModel=createCollectibleCoin();
      const grp=new THREE.Group();
      grp.add(coinModel);
      grp.position.set(sp.position.x,sp.position.y+COIN_FLOAT_HEIGHT,sp.position.z);
      grp.visible=false; // hidden until EXPLORE phase
      scene.add(grp);
      coins.push({
        mesh:grp,
        platform:sp,
        active:true,
        respawnTimer:0,
        flyT:-1, // fly-away animation timer
        flyStartY:0,
      });
    }
    coinsLoaded=true;
    console.log('[Coin] Loaded! Total coins:',coins.length);
  }catch(e){
    console.error('[Coin] Load error:',e);
  }
}
loadCoins();

function updateCoins(dt){
  if(!coinsLoaded)return;
  // Show coins + counter only after entering EXPLORE phase
  if(!coinsVisible&&phase===PHASE.EXPLORE){
    coinsVisible=true;
    document.getElementById('coin-counter').classList.add('show');
    for(const c of coins){ if(c.active) c.mesh.visible=true; }
  }
  if(!coinsVisible)return;
  for(const c of coins){
    // Follow platform position + float above it
    const sp=c.platform;
    if(c.active){
      c.mesh.position.x=sp.position.x;
      c.mesh.position.z=sp.position.z;
      c.mesh.position.y=sp.position.y+COIN_FLOAT_HEIGHT+Math.sin(globalTime*1.8+sp.userData.floatPhase)*0.4;
      c.mesh.children[0].rotation.y=globalTime*2.0;
      c.mesh.visible=true;

      // Collision with player
      if(phase===PHASE.EXPLORE&&charReady){
        const dx=charRoot.position.x-c.mesh.position.x;
        const dy=(charRoot.position.y+(baseModelY||1.5))-c.mesh.position.y;
        const dz=charRoot.position.z-c.mesh.position.z;
        const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
        if(dist<COIN_HIT_DIST){
          // Collect!
          c.active=false;
          c.flyT=0;
          c.flyStartY=c.mesh.position.y;
          if(connected)api('/api/game',{action:'earn',index:coins.indexOf(c)}).catch(e=>message(e.message));else coinCount++;
          document.getElementById('coin-num').textContent='x '+coinCount;
        }
      }
    }else if(c.flyT>=0){
      // Fly-away animation
      c.flyT+=dt;
      const flyDur=0.8;
      if(c.flyT<flyDur){
        const t=c.flyT/flyDur;
        c.mesh.position.y=c.flyStartY+t*5;
        c.mesh.children[0].rotation.y=globalTime*6.0;
        const s=COIN_SCALE*(1-t);
        c.mesh.children[0].scale.setScalar(s>0?s:0.01);
        c.mesh.visible=true;
      }else{
        c.mesh.visible=false;
        c.mesh.children[0].scale.setScalar(COIN_SCALE);
        c.flyT=-1;
        c.respawnTimer=COIN_RESPAWN_TIME;
      }
    }else{
      // Waiting to respawn
      c.respawnTimer-=dt;
      if(c.respawnTimer<=0){
        c.active=true;
        c.mesh.visible=true;
        c.mesh.children[0].scale.setScalar(COIN_SCALE);
      }
    }
  }
}


// ===== Mushroom Cloud Particle Burst (蕈狀雲) =====
let burst=null;
function createBurst(pos){
  if(burst){scene.remove(burst.mesh);burst.geo.dispose();burst.mesh.material.dispose();burst=null;}
  const N=22000,pts=[],cols=[],vels=[],sizes=[];
  for(let i=0;i<N;i++){
    // 3D sphere of tiny particles, expanding outward
    const u=Math.random()*2-1;
    const th=Math.random()*Math.PI*2;
    const s=Math.sqrt(1-u*u);
    const dx=s*Math.cos(th),dy=u,dz=s*Math.sin(th);
    const r0=Math.cbrt(Math.random())*1.0;
    const px=pos.x+dx*r0,py=pos.y+dy*r0,pz=pos.z+dz*r0;
    const speed=6+Math.random()*16;
    const vx=dx*speed,vy=dy*speed,vz=dz*speed;
    pts.push(px,py,pz);
    const brightness=0.75+Math.random()*0.25;
    const r=brightness;
    const g=brightness*(0.75+Math.random()*0.25);
    const b=brightness*Math.random()*0.2;
    cols.push(r,g,b);
    vels.push(vx,vy,vz);
    sizes.push(0.03+Math.random()*0.12);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  geo.setAttribute('size',new THREE.Float32BufferAttribute(sizes,1));
  const mat=new THREE.PointsMaterial({size:0.22,vertexColors:true,transparent:true,opacity:1,depthWrite:false,sizeAttenuation:true,blending:THREE.AdditiveBlending});
  const mesh=new THREE.Points(geo,mat);
  scene.add(mesh);
  burst={mesh,vels,time:0,geo,N,fadePlants:0};
}
function updateBurst(dt){
  if(!burst)return;
  burst.time+=dt;
  burst.fadePlants=Math.min(1,burst.fadePlants+dt*3);
  const p=burst.geo.getAttribute('position');
  const drag=0.98;
  for(let i=0;i<burst.N;i++){
    burst.vels[i*3]*=drag;
    burst.vels[i*3+1]-=2*dt; // floaty
    burst.vels[i*3+1]*=drag;
    burst.vels[i*3+2]*=drag;
    p.setX(i,p.getX(i)+burst.vels[i*3]*dt);
    p.setY(i,Math.max(-0.1,p.getY(i)+burst.vels[i*3+1]*dt));
    p.setZ(i,p.getZ(i)+burst.vels[i*3+2]*dt);
  }
  p.needsUpdate=true;
  // Fade out over 5 seconds for longer spectacle
  const fade=Math.max(0,1-burst.time/5);
  burst.mesh.material.opacity=fade;
  burst.mesh.material.size=0.22*Math.max(0.3,1-burst.time*0.08);
  if(burst.time>5.5){
    scene.remove(burst.mesh);burst.geo.dispose();burst.mesh.material.dispose();
    burst=null;
  }
}

// ===== Character Aura (yellow glow particles) =====
let aura=null;
function createAura(){
  if(aura||!charRoot||!charModel)return;
  const meshes=[];
  charRoot.updateMatrixWorld(true);
  charModel.updateMatrixWorld(true);
  charModel.traverse(o=>{
    if(o.isMesh&&o.geometry&&o.geometry.attributes&&o.geometry.attributes.position){
      meshes.push(o);
    }
  });
  const N=4200,pts=[],cols=[],sizes=[],meshIds=[],vertIds=[],offs=[];
  const tmp=new THREE.Vector3();
  if(meshes.length){
    for(let i=0;i<N;i++){
      const mi=Math.floor(Math.random()*meshes.length);
      const m=meshes[mi];
      const pos=m.geometry.attributes.position;
      if(!pos||pos.count===0){i--;continue}
      const vi=Math.floor(Math.random()*pos.count);
      if(m.isSkinnedMesh&&m.skeleton&&m.geometry.attributes.skinIndex){
        m.boneTransform(vi,tmp);
      }else{
        tmp.set(pos.getX(vi),pos.getY(vi),pos.getZ(vi));
      }
      tmp.applyMatrix4(m.matrixWorld);
      charRoot.worldToLocal(tmp);
      const ox=(Math.random()-0.5)*0.02,oy=(Math.random()-0.5)*0.02,oz=(Math.random()-0.5)*0.02;
      pts.push(tmp.x+ox,tmp.y+oy,tmp.z+oz);
      const g=0.72+Math.random()*0.16;
      const b=0.14+Math.random()*0.1;
      cols.push(1.0,g,b);
      sizes.push(0.006+Math.random()*0.012);
      meshIds.push(mi);vertIds.push(vi);offs.push(ox,oy,oz);
    }
  }else{
    for(let i=0;i<N;i++){
      const u=Math.random()*2-1;
      const th=Math.random()*Math.PI*2;
      const s=Math.sqrt(1-u*u);
      const dx=s*Math.cos(th),dy=u,dz=s*Math.sin(th);
      const r=0.5+Math.random()*0.6;
      pts.push(dx*r,dy*r+1.0,dz*r);
      cols.push(1.0,0.8+Math.random()*0.1,0.18+Math.random()*0.08);
      sizes.push(0.007+Math.random()*0.012);
      meshIds.push(-1);vertIds.push(-1);offs.push(0,0,0);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  geo.setAttribute('size',new THREE.Float32BufferAttribute(sizes,1));
  const mat=new THREE.PointsMaterial({
    size:0.02,vertexColors:true,transparent:true,opacity:0.75,
    depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true
  });
  const mesh=new THREE.Points(geo,mat);
  charRoot.add(mesh);
  aura={mesh,geo,time:0,meshes,meshIds,vertIds,offs,tmp:new THREE.Vector3()};
}
function updateAura(dt){
  if(!aura)return;
  aura.time+=dt;
  aura.mesh.rotation.y+=dt*0.12;
  aura.mesh.material.opacity=Math.max(0,0.75*(1-aura.time/1.6));
  const p=aura.geo.getAttribute('position');
  const tmp=aura.tmp;
  for(let i=0;i<aura.meshIds.length;i++){
    const mi=aura.meshIds[i];
    if(mi<0)continue;
    const m=aura.meshes[mi];
    const pos=m.geometry.attributes.position;
    const vi=aura.vertIds[i];
    if(!pos||vi<0||vi>=pos.count)continue;
    if(m.isSkinnedMesh&&m.skeleton&&m.geometry.attributes.skinIndex){
      m.boneTransform(vi,tmp);
    }else{
      tmp.set(pos.getX(vi),pos.getY(vi),pos.getZ(vi));
    }
    tmp.applyMatrix4(m.matrixWorld);
    charRoot.worldToLocal(tmp);
    const oi=i*3;
    p.setXYZ(i,tmp.x+aura.offs[oi],tmp.y+aura.offs[oi+1],tmp.z+aura.offs[oi+2]);
  }
  p.needsUpdate=true;
  if(aura.time>1.6){
    charRoot.remove(aura.mesh);
    aura.geo.dispose();
    aura.mesh.material.dispose();
    aura=null;
  }
}

// ===== Drink Glow (warm yellow skin pulse) =====
const warmGlow=new THREE.Color('#ff1a3a');
let drinkGlowT=-1;
const DRINK_GLOW_DUR=2.4;
let pulseGlow=null;
function startDrinkGlow(){drinkGlowT=0}
function resetDrinkGlow(){
  drinkGlowT=-1;
  if(pulseGlow){
    pulseGlow.root.parent?.remove(pulseGlow.root);
    pulseGlow.root.traverse(o=>{
      if(o.material){
        const mats=Array.isArray(o.material)?o.material:[o.material];
        mats.forEach(m=>m.dispose());
      }
    });
    pulseGlow=null;
  }
  if(mouthText){
    for(const it of mouthText.items){it.el.remove();}
    mouthText=null;
  }
  for(const info of charMats){
    const m=info.mat;
    if(info.baseEmissive&&m.emissive)m.emissive.copy(info.baseEmissive);
    if('emissiveIntensity' in m)m.emissiveIntensity=info.baseEmissiveIntensity||0;
  }
}
function updateDrinkGlow(dt){
  if(drinkGlowT<0)return;
  drinkGlowT+=dt;
  const k=0.4; // body emissive red tint strength
  if(!pulseGlow&&charModel){
    const root=new THREE.Group();
    const makeMat=()=>new THREE.MeshBasicMaterial({
      color:0xff1a3a,transparent:true,opacity:0.6,
      blending:THREE.NormalBlending,depthWrite:false,depthTest:false,
      side:THREE.BackSide
    });
    charModel.traverse(o=>{
      if(o.isSkinnedMesh){
        const outline=new THREE.SkinnedMesh(o.geometry,makeMat());
        outline.bind(o.skeleton,o.bindMatrix);
        outline.frustumCulled=false;
        outline.renderOrder=10;
        root.add(outline);
      }else if(o.isMesh){
        const outline=new THREE.Mesh(o.geometry,makeMat());
        outline.position.copy(o.position);
        outline.rotation.copy(o.rotation);
        outline.scale.copy(o.scale);
        outline.frustumCulled=false;
        outline.renderOrder=10;
        root.add(outline);
      }
    });
    charRoot.add(root);
    pulseGlow={root,time:0};
  }
  if(pulseGlow){
    pulseGlow.time+=dt;
    const t=(pulseGlow.time*10)%1; // 10 pulses per second
    const u=t<0.5 ? (t*2) : (1-(t-0.5)*2); // out then back in
    const s=1+u*0.18;
    pulseGlow.root.position.copy(charModel.position);
    pulseGlow.root.rotation.copy(charModel.rotation);
    pulseGlow.root.scale.copy(charModel.scale).multiplyScalar(s);
    pulseGlow.root.traverse(o=>{
      if(o.material){
        const mats=Array.isArray(o.material)?o.material:[o.material];
        mats.forEach(m=>{m.opacity=0.3+0.5*(1-u);});
      }
    });
  }
  for(const info of charMats){
    const m=info.mat;
    if(m.emissive){
      const base=info.baseEmissive?info.baseEmissive:new THREE.Color(0,0,0);
      m.emissive.copy(base).lerp(warmGlow,k);
      if('emissiveIntensity' in m)m.emissiveIntensity=(info.baseEmissiveIntensity||0)+k;
    }
  }
  if(phase===PHASE.LAND||phase===PHASE.DONE)resetDrinkGlow();
}

// ===== Cinematic Camera =====
function cinematicCam(dt){
  if(phase===PHASE.IDLE||phase===PHASE.DRINK){
    return false; // orbit cam
  }
  if(phase===PHASE.ASCEND){
    // Camera pulls up high, filming platform + character rising
    const py=platformMesh.position.y;
    const camH=py+12; // camera stays above the platform
    const camR=18; // horizontal distance from platform
    const angle=globalTime*0.3; // slow orbit while ascending
    camera.position.set(
      platformMesh.position.x+camR*Math.sin(angle),
      camH,
      platformMesh.position.z+camR*Math.cos(angle)
    );
    camera.lookAt(platformMesh.position.x,py+1,platformMesh.position.z);
    return true;
  }
  if(phase===PHASE.EXPLORE){
    return false; // always use orbit/follow cam during explore
  }
  if(phase===PHASE.FALL){
    if(autoWalkPhase) return false; // use orbit cam during auto-walk on platform
    const t=Math.min(1,phaseT/3);
    const ease=t*t*(3-2*t);
    const cy=charRoot.position.y+1;
    // Tag-K style but rotated 180°: camera swings along X axis (stairs→outward)
    // Starts at +X (stairs side), swings to -X (outward)
    const camX=15*(1-2*ease);
    const camY=Math.max(2,cy+3.5-ease*cy*0.7);
    camera.position.set(camX,camY,0);
    camera.lookAt(0,charRoot.position.y+0.5,0);
    return true;
  }
  if(phase===PHASE.LAND){
    // Orbit around plant/explosion position with wide shot
    const plantPos=lastPlantedPos||new THREE.Vector3(0,0,0);
    const orbitAngle=globalTime*0.5;
    const orbitR=20;
    const camX=plantPos.x+orbitR*Math.sin(orbitAngle);
    const camZ=plantPos.z+orbitR*Math.cos(orbitAngle);
    camera.position.set(camX,8,camZ);
    camera.lookAt(plantPos.x,2,plantPos.z);
    return true;
  }
  return false;
}

// ===== Character Animation State Machine =====
const EXPLORE_MAX_SPEED=8.64; // max speed (150% of 5.76)
const EXPLORE_ACCEL=6; // acceleration (units/sec²)
const EXPLORE_DECEL=12; // deceleration when releasing joystick
let curSpeed=0; // current movement speed
const GRAVITY=25;
const JUMP_VEL=10;
let exploreWalkPlaying=false;
let autoWalkPhase=false;let autoWalkT=0; // auto-walk to edge after drink
let jumpVelX=0,jumpVelZ=0; // horizontal momentum preserved from jump

// Terrain height at any XZ position
function getTerrainHeight(x,z,curY){
  const constructionHeight=buildTerrainHeight(x,z,curY);if(constructionHeight!==null)return constructionHeight;
  // Flying platform (only when visible and character is near it)
  if(platformMesh.visible){
    const px=platformMesh.position.x,py=platformMesh.position.y,pz=platformMesh.position.z;
    const pd=Math.sqrt((x-px)**2+(z-pz)**2);
    if(pd<4.5&&Math.abs(curY-(py+DISC_LIFT))<5) return py+DISC_LIFT;
  }
  // Floating sky platforms — find highest platform below character (no fall-through)
  let bestSkyH=-Infinity,bestSkyPlat=null;
  for(const sp of skyPlats){
    const spx=sp.position.x,spy=sp.position.y,spz=sp.position.z;
    const spd=Math.sqrt((x-spx)**2+(z-spz)**2);
    const spR=sp.geometry.parameters.radiusTop||1.2;
    const spTop=spy+0.2;
    // Character must be above platform surface and within reach
    if(spd<spR&&curY>=spTop-0.5&&spTop>bestSkyH){
      bestSkyH=spTop;bestSkyPlat=sp;
    }
  }
  if(bestSkyPlat){currentSkyPlat=bestSkyPlat;return bestSkyH;}
  currentSkyPlat=null;
  // Straight staircase collision — only when visible
  if(stairGroup.visible){
    const STAIR_COLLISION_LIFT=1.5; // ← 手動微調階梯碰撞面高度
    const stairT=(STAIR_Z_FAR-z)/(STAIR_Z_FAR-STAIR_Z_NEAR);
    // Extend zone slightly beyond bottom so there's no cliff
    if(stairT>=-0.3&&stairT<=1.05&&Math.abs(x)<6){
      // Continuous ramp, clamped so bottom smoothly meets ground
      const stairH=Math.max(0, stairT*STAIR_TOP_Y+STAIR_COLLISION_LIFT);
      if(Math.abs(curY-stairH)<4) return stairH;
    }
  }
  return holeAt(x,z)?-100:0; // Holes have no ground collision at water level.
}

function showControls(v){
  const el=document.getElementById('game-controls');
  if(v)el.classList.remove('hide');else el.classList.add('hide');
}

function animateChar(dt){
  if(!charReady||!mixer)return;
  mixer.update(dt);

  // Safety: keep character visible during active phases (skip during monster death)
  if(phase!==PHASE.DONE&&phase!==PHASE.LAND&&!monsterDeathActive){
    if(!charRoot.visible)charRoot.visible=true;
    if(charModel&&!charModel.visible)charModel.visible=true;
  }
  if(rootBone&&rootBoneBase){
    rootBone.position.x=rootBoneBase.x;
    rootBone.position.z=rootBoneBase.z;
    if(rootBone.position.y<rootBoneBase.y)rootBone.position.y=rootBoneBase.y;
    rootBone.updateMatrixWorld(true);
  }

  if(phase===PHASE.DRINK){
    const drinkDur=clipDrink?clipDrink.duration*(1-DRINK_START):1.0;
    if(phaseT<0.8)startMouthText();
    if(phaseT>=drinkDur){
      startDrinkGlow();
      // After drink: auto-walk to platform edge then fall
      phase=PHASE.FALL;phaseT=0;
      autoWalkPhase=true;autoWalkT=0;
      onPlatform=true;isJumping=false;charVelY=0;
      showControls(false);
      actDrink?.fadeOut(0.3);
      // Start walk/run animation for auto-walk to edge
      const moveClip=clipRun||clipWalk;
      if(moveClip&&mixer){
        actWalk=mixer.clipAction(moveClip);
        actWalk.setLoop(THREE.LoopRepeat);
        actWalk.reset().fadeIn(0.3).play();
      }
      exploreWalkPlaying=true;
      // Face toward edge (toward -Z)
      if(charModel)charModel.rotation.y=Math.PI;
      charRoot.userData.fallStartY=charRoot.position.y;
    }
  }
  else if(phase===PHASE.EXPLORE){
    recoverFromHole();
    if(holeAt(charRoot.position.x,charRoot.position.z)&&charRoot.position.y<=.05&&!isJumping){isJumping=true;charVelY=0;}
    const moving=Math.abs(joyX)>0.15||Math.abs(joyY)>0.15;

    // Switch run/idle animation (prefer clipRun over clipWalk)
    const moveClip=clipRun||clipWalk;
    if(moving&&!exploreWalkPlaying&&moveClip&&!isJumping){
      actIdle?.fadeOut(0.2);
      actWalk?.stop();
      actWalk=mixer.clipAction(moveClip);
      actWalk.setLoop(THREE.LoopRepeat);
      actWalk.reset().fadeIn(0.2).play();
      exploreWalkPlaying=true;
    }else if(!moving&&exploreWalkPlaying&&!isJumping){
      actWalk?.fadeOut(0.2);
      if(clipIdle){
        actIdle=mixer.clipAction(clipIdle);
        actIdle.reset().fadeIn(0.2).play();
      }
      exploreWalkPlaying=false;
    }

    // 360-degree camera-relative movement with acceleration
    if(moving&&!isJumping){
      curSpeed=Math.min(EXPLORE_MAX_SPEED*currentStats().speedMultiplier,curSpeed+EXPLORE_ACCEL*currentStats().speedMultiplier*dt);
      const fwdX=-Math.sin(camYaw),fwdZ=-Math.cos(camYaw);
      const rightX=-Math.cos(camYaw),rightZ=Math.sin(camYaw);
      let mdx=-joyY*fwdX-joyX*rightX;
      let mdz=-joyY*fwdZ-joyX*rightZ;
      const ml=Math.sqrt(mdx*mdx+mdz*mdz);
      if(ml>0){mdx/=ml;mdz/=ml}
      const spd=curSpeed*dt;
      const nx=charRoot.position.x+mdx*spd;
      const nz=charRoot.position.z+mdz*spd;
      const curH=charRoot.position.y;
      const newH=getTerrainHeight(nx,nz,curH);
      const maxClimb=3.0,maxDrop=4.0;
      if(newH-curH<maxClimb&&!blockedByBuild(nx,nz,curH)){
        if(curH-newH>maxDrop){
          charRoot.position.x=nx;charRoot.position.z=nz;
          isJumping=true;charVelY=0;
        }else{
          charRoot.position.x=nx;charRoot.position.z=nz;
          charRoot.position.y=newH;
        }
      }
      // Slide along walls instead of stopping both movement axes at corners.
      else if(newH-curH<maxClimb){if(!blockedByBuild(nx,charRoot.position.z,curH))charRoot.position.x=nx;if(!blockedByBuild(charRoot.position.x,nz,curH))charRoot.position.z=nz;}
      const moveAngle=Math.atan2(mdx,mdz);
      if(charModel)charModel.rotation.set(0,moveAngle,0);
    }else if(!isJumping){
      curSpeed=Math.max(0,curSpeed-EXPLORE_DECEL*dt);
    }
    // Always set model offset
    if(charModel)charModel.position.set(0,baseModelY||0,0);

    // Jumping physics
    if(isJumping){
      // Track fall start height
      if(!charRoot.userData.fallStartY||charRoot.userData.fallStartY<charRoot.position.y)
        charRoot.userData.fallStartY=charRoot.position.y;
      charVelY-=GRAVITY*wingGravity()*dt;
      const nextJumpY=charRoot.position.y+charVelY*dt,ceiling=charVelY>0?buildCeiling(charRoot.position.x,charRoot.position.z,charRoot.position.y,nextJumpY):Infinity;
      if(Number.isFinite(ceiling)){charRoot.position.y=ceiling-1.5;charVelY=0;}else charRoot.position.y=nextJumpY;
      if(charRoot.userData.wingFlight&&charRoot.position.y>40){charRoot.position.y=40;charVelY=Math.min(0,charVelY);}
      // ? block collision — hit from below while rising (cooldown-based, multi-hit)
      if(qBlockGroup.userData.bounceT<0&&charVelY>0){
        const qp=qBlockGroup.position;
        const dx=charRoot.position.x-qp.x,dz=charRoot.position.z-qp.z;
        const headY=charRoot.position.y+(baseModelY?Math.abs(baseModelY)*2:2.5);
        if(Math.abs(dx)<1.5&&Math.abs(dz)<1.5&&headY>=qp.y-1.0&&headY<=qp.y+0.5){
          qBlockGroup.userData.bounceT=0;
          qBlockGroup.userData.flashT=0;
          qBlockGroup.userData.pendingStatement=true;
          charVelY=0;
        }
      }
      // Apply preserved horizontal momentum + active input
      if(!blockedByBuild(charRoot.position.x+jumpVelX*dt,charRoot.position.z,charRoot.position.y))charRoot.position.x+=jumpVelX*dt;
      if(!blockedByBuild(charRoot.position.x,charRoot.position.z+jumpVelZ*dt,charRoot.position.y))charRoot.position.z+=jumpVelZ*dt;
      if(moving){
        const fwdX=-Math.sin(camYaw),fwdZ=-Math.cos(camYaw);
        const rightX=-Math.cos(camYaw),rightZ=Math.sin(camYaw);
        let mdx=-joyY*fwdX-joyX*rightX;
        let mdz=-joyY*fwdZ-joyX*rightZ;
        const ml=Math.sqrt(mdx*mdx+mdz*mdz);
        if(ml>0){mdx/=ml;mdz/=ml}
        if(!blockedByBuild(charRoot.position.x+mdx*curSpeed*dt*.3,charRoot.position.z,charRoot.position.y))charRoot.position.x+=mdx*curSpeed*dt*.3;
        if(!blockedByBuild(charRoot.position.x,charRoot.position.z+mdz*curSpeed*dt*.3,charRoot.position.y))charRoot.position.z+=mdz*curSpeed*dt*.3;
      }

      // Switch to fall animation when descending significantly
      const isBigFall=charRoot.userData.fallStartY>=40&&!charRoot.userData.wingFlight;
      if(charVelY<0&&isBigFall){
        if(!actFall||!actFall.isRunning()){
          actJump?.fadeOut(0.2);
          if(clipFall){
            actFall=mixer.clipAction(clipFall);
            actFall.setLoop(THREE.LoopRepeat);
            actFall.reset().fadeIn(0.2).play();
          }
        }
        const fallProgress=1-Math.max(0,charRoot.position.y/PLAT_Y);
        updateSky(fallProgress);
      }

      if(charRoot.position.y<=0&&!holeAt(charRoot.position.x,charRoot.position.z)){
        // Landed on ground
        charRoot.position.y=0;
        isJumping=false;
        // Show statement after landing from ? block hit
        if(qBlockGroup.userData.pendingStatement){
          qBlockGroup.userData.pendingStatement=false;
          const so=document.getElementById('statement-overlay');
          so.classList.add('show');
          so.style.opacity='0';
          so.querySelector('#statement-box').style.transform='scale(0.3)';
          let stT=0;
          const stAnim=()=>{stT+=16;const p=Math.min(1,stT/400);const e=1-(1-p)*(1-p);
            so.style.opacity=e.toFixed(3);
            so.querySelector('#statement-box').style.transform=`scale(${(0.3+0.7*e).toFixed(3)})`;
            if(p<1)requestAnimationFrame(stAnim);};
          requestAnimationFrame(stAnim);
        }
        const fellFromHigh=charRoot.userData.fallStartY>=40&&!charRoot.userData.wingFlight;charRoot.userData.wingFlight=false;
        charRoot.userData.fallStartY=0;
        if(fellFromHigh){
          // Explosion — plant only if text was entered (from platform arrow)
          showControls(false);
          phase=PHASE.LAND;phaseT=0;
          actFall?.fadeOut(0.3);actJump?.fadeOut(0.1);
          if(charModel){charModel.position.set(0,baseModelY,0);charModel.rotation.y=0}
          charRoot.visible=false;
          if(charModel)charModel.visible=false;
          createBurst(new THREE.Vector3(charRoot.position.x,0,charRoot.position.z));
          if(firstText){
            const planted=addPlant(firstText,true,null,firstUsername);
            if(planted&&charRoot.userData.ascendFromBlue){
              planted.scale.set(2,2,2); // blue platform plants are 2x height
            }
            saveEntry(firstText,firstUsername);
            if(planted){clearGlow();addGlow(planted)}
          }
          platformMesh.visible=true;stairGroup.visible=true;
          arrowBridge.visible=true;arrowGroup.visible=false;
        }else{
          // Low fall — just land normally
          charVelY=0;
          actJump?.fadeOut(0.2);
          if(clipIdle){
            actIdle=mixer.clipAction(clipIdle);
            actIdle.reset().fadeIn(0.2).play();
          }
          exploreWalkPlaying=false;
        }
      }else{
        // Land on terrain (stair or platform)
        const terrH=getTerrainHeight(charRoot.position.x,charRoot.position.z,charRoot.position.y);
        if(charVelY<0&&charRoot.position.y<=terrH){
          charRoot.position.y=terrH;
          charVelY=0;isJumping=false;
          charRoot.userData.fallStartY=0;
          // Snap to center only on blue top platforms (not regular floating ones)
          if(currentSkyPlat&&currentSkyPlat.userData.isTop){
            charRoot.position.x=currentSkyPlat.position.x;
            charRoot.position.z=currentSkyPlat.position.z;
          }
          // Show statement after landing from ? block hit
          if(qBlockGroup.userData.pendingStatement){
            qBlockGroup.userData.pendingStatement=false;
            const so=document.getElementById('statement-overlay');
            so.classList.add('show');
            so.style.opacity='0';
            so.querySelector('#statement-box').style.transform='scale(0.3)';
            let stT=0;
            const stAnim=()=>{stT+=16;const p=Math.min(1,stT/400);const e=1-(1-p)*(1-p);
              so.style.opacity=e.toFixed(3);
              so.querySelector('#statement-box').style.transform=`scale(${(0.3+0.7*e).toFixed(3)})`;
              if(p<1)requestAnimationFrame(stAnim);};
            requestAnimationFrame(stAnim);
          }
          actJump?.fadeOut(0.2);
          if(clipIdle){
            actIdle=mixer.clipAction(clipIdle);
            actIdle.reset().fadeIn(0.2).play();
          }
          exploreWalkPlaying=false;
        }
      }
    }

    // Detect if character reached bridge step at stair top → trigger ASCEND
    if(!isJumping&&bridgePos){
      const bdx=charRoot.position.x-bridgePos.x;
      const bdz=charRoot.position.z-bridgePos.z;
      if(Math.sqrt(bdx*bdx+bdz*bdz)<5&&Math.abs(charRoot.position.y-bridgePos.y)<2){
        // Character on bridge — start ASCEND
        phase=PHASE.ASCEND;phaseT=0;
        showControls(false);
        arrowBridge.visible=false;
        stairGroup.visible=false; // hide stairs from ASCEND until RETURN
        // Show flying disc at bridge position
        platformMesh.position.copy(bridgePos);
        platformSide.material=platformMat;platformTop.material=platformMat;
        charRoot.userData.ascendFromBlue=false;
        platformMesh.visible=true;
        charRoot.position.set(bridgePos.x,bridgePos.y+DISC_LIFT,bridgePos.z);
        // Play idle
        actWalk?.fadeOut(0.2);
        if(clipIdle&&mixer){actIdle=mixer.clipAction(clipIdle);actIdle.reset().fadeIn(0.2).play()}
        exploreWalkPlaying=false;curSpeed=0;
      }
    }
    // Detect if character is on a blue top platform → ASCEND to PLAT_Y
    if(!isJumping&&currentSkyPlat&&currentSkyPlat.userData.isTop&&phase===PHASE.EXPLORE){
      phase=PHASE.ASCEND;phaseT=0;
      showControls(false);
      stairGroup.visible=false;
      // Use blue platform position as ASCEND start — disc becomes blue
      const bp=currentSkyPlat.position;
      platformMesh.position.set(bp.x,bp.y,bp.z);
      platformSide.material=blueDiscMat;platformTop.material=blueDiscMat;
      charRoot.userData.ascendFromBlue=true;
      platformMesh.visible=true;
      charRoot.position.set(bp.x,bp.y+DISC_LIFT,bp.z);
      // Override bridgePos temporarily for ASCEND interpolation
      charRoot.userData.ascendStartX=bp.x;
      charRoot.userData.ascendStartY=bp.y;
      charRoot.userData.ascendStartZ=bp.z;
      actWalk?.fadeOut(0.2);
      if(clipIdle&&mixer){actIdle=mixer.clipAction(clipIdle);actIdle.reset().fadeIn(0.2).play()}
      exploreWalkPlaying=false;curSpeed=0;
    }
    // Detect if on flying platform (during EXPLORE after DRINK)
    if(platformMesh.visible){
      const px=platformMesh.position.x,pz=platformMesh.position.z;
      const pd=Math.sqrt((charRoot.position.x-px)**2+(charRoot.position.z-pz)**2);
      onPlatform=pd<4.5&&Math.abs(charRoot.position.y-platformMesh.position.y)<2;
    }else{onPlatform=false}
  }
  else if(phase===PHASE.ASCEND){
    // Flying disc rises from bridge to PLAT_Y over 3 seconds
    const ASCEND_DUR=3.0;
    const t=Math.min(1,phaseT/ASCEND_DUR);
    const ease=t*t*(3-2*t); // smoothstep
    // Reduce fog so ground stays green when viewed from high up
    if(scene.fog)scene.fog.density=0.008*(1-ease*0.9);
    const asX=charRoot.userData.ascendStartX??bridgePos.x;
    const asY=charRoot.userData.ascendStartY??bridgePos.y;
    const asZ=charRoot.userData.ascendStartZ??bridgePos.z;
    const curPlatY=asY+(PLAT_Y-asY)*ease;
    const curPlatX=asX*(1-ease);
    const curPlatZ=asZ*(1-ease);
    platformMesh.position.set(curPlatX,curPlatY,curPlatZ);
    charRoot.position.set(curPlatX,curPlatY+DISC_LIFT,curPlatZ);
    if(charModel)charModel.position.set(0,baseModelY||0,0);
    // Camera follows
    camTarget.x+=(curPlatX-camTarget.x)*dt*4;
    camTarget.y+=(curPlatY+1.5-camTarget.y)*dt*4;
    camTarget.z+=(curPlatZ-camTarget.z)*dt*4;
    if(t>=1){
      // Arrived — show WRITE button (no movement controls)
      phase=PHASE.IDLE;phaseT=0;
      onPlatform=true;isJumping=false;charVelY=0;
      charRoot.userData.ascendStartX=null;charRoot.userData.ascendStartY=null;charRoot.userData.ascendStartZ=null;charRoot.userData.ascendFromBlue=false;
      platformMesh.position.set(0,PLAT_Y,0);
      charRoot.position.set(0,PLAT_Y+DISC_LIFT,0);
      if(charModel)charModel.rotation.y=0; // face +Z toward camera (camYaw=0 puts camera at +Z)
      arrowGroup.visible=true;
      showControls(false);
      ui.classList.remove('hidden');
      ui.classList.remove('mini');
      // Set camera to front view
      camYaw=0;camPitch=0.2;camDist=7;
      camTarget.set(0,PLAT_Y+1,0);
    }
  }
  else if(phase===PHASE.FALL){
    // Auto-walk to edge phase before actual fall
    if(autoWalkPhase){
      if(!charRoot.userData.walkStartPos) charRoot.userData.walkStartPos={x:charRoot.position.x,z:charRoot.position.z};
      autoWalkT+=dt;
      const WALK_DUR=0.6; // short walk to disc edge
      const walkProgress=Math.min(1,autoWalkT/WALK_DUR);
      const easeWalk=walkProgress*walkProgress*(3-2*walkProgress);
      const wsp=charRoot.userData.walkStartPos;
      charRoot.position.x=wsp.x;
      charRoot.position.z=wsp.z+easeWalk*(-3.0); // stay within disc radius
      if(charModel){
        charModel.position.set(0,baseModelY||0,0);
        charModel.rotation.y=Math.PI; // face walk direction
      }
      // Camera follows
      camTarget.x+=(charRoot.position.x-camTarget.x)*dt*4;
      camTarget.y+=(charRoot.position.y+1.5-camTarget.y)*dt*4;
      camTarget.z+=(charRoot.position.z-camTarget.z)*dt*4;
      if(walkProgress>=1){
        // Reached edge — jump off
        autoWalkPhase=false;
        phaseT=0;
        actWalk?.fadeOut(0.2);
        exploreWalkPlaying=false;
        // Play jump then fall animation
        if(clipJump&&mixer){
          actJump=mixer.clipAction(clipJump);
          actJump.setLoop(THREE.LoopOnce);actJump.clampWhenFinished=true;
          actJump.reset().fadeIn(0.2).play();
        }
        setTimeout(()=>{
          actJump?.fadeOut(0.2);
          if(clipFall&&mixer){
            actFall=mixer.clipAction(clipFall);
            actFall.setLoop(THREE.LoopRepeat);
            actFall.reset().fadeIn(0.2).play();
          }
        },400);
        charRoot.userData.fallStartY=charRoot.position.y;
      }
      return; // skip normal fall logic during walk
    }
    const dur=3.0;
    const t=Math.min(1,phaseT/dur);
    const easeIn=t*t;
    const fy=charRoot.userData.fallStartY||charRoot.position.y;
    // Pre-calculate plant landing position on first frame
    if(!charRoot.userData.fallLandPos){
      // Predict where the plant will grow
      const rr=srand(hash(firstText||'')+plantEntries.length);
      let landX=0,landZ=0;
      const n=plantEntries.length;
      const minR=Math.max(3.0, Math.sqrt((n+1)/(Math.PI*1.8)));
      if(n>0&&rr()<0.35){
        const existing=plantEntries[Math.floor(rr()*n)];
        landX=existing.mesh.position.x;landZ=existing.mesh.position.z;
      }else{
        const angle=rr()*Math.PI*2;
        const r=minR*(0.7+rr()*0.3);
        landX=Math.cos(angle)*r;landZ=Math.sin(angle)*r;
      }
      charRoot.userData.fallLandPos={x:landX,z:landZ};
      charRoot.userData.fallStartX=charRoot.position.x;
      charRoot.userData.fallStartZ=charRoot.position.z;
    }
    const lp=charRoot.userData.fallLandPos;
    // Move character XZ toward plant position during fall
    charRoot.position.x=charRoot.userData.fallStartX+(lp.x-charRoot.userData.fallStartX)*easeIn;
    charRoot.position.z=charRoot.userData.fallStartZ+(lp.z-charRoot.userData.fallStartZ)*easeIn;
    charRoot.position.y=fy-fy*easeIn;
    if(charModel){
      charModel.position.set(0,baseModelY||0,0);
      charModel.rotation.y=0;
    }
    updateSky(t);
    if(t>=1){
      phase=PHASE.LAND;phaseT=0;
      charRoot.position.set(lp.x,0,lp.z);
      actFall?.fadeOut(0.3);
      if(charModel){charModel.position.set(0,baseModelY,0);charModel.rotation.y=0}
      charRoot.visible=false;
      if(charModel)charModel.visible=false;
      createBurst(new THREE.Vector3(lp.x,0,lp.z));
      if(firstText){
        const planted=addPlant(firstText,true,null,firstUsername);
        if(planted&&charRoot.userData.ascendFromBlue){
          planted.scale.set(2,2,2); // blue platform plants are 2x height
        }
        saveEntry(firstText,firstUsername);
        if(planted){clearGlow();addGlow(planted)}
      }
      charRoot.userData.fallLandPos=null;
      platformMesh.visible=true;
      stairGroup.visible=false;
      arrowBridge.visible=true;
      arrowGroup.visible=false;
    }
  }
  else if(phase===PHASE.LAND){
    if(phaseT>=2.5){
      phase=PHASE.DONE;phaseT=0;
      interacting=false;interTimer=0;
      camYaw=0.3;camPitch=0.35;camDist=8;
      if(lastPlantedPos)camTarget.set(lastPlantedPos.x,2,lastPlantedPos.z);
      else camTarget.set(0,3,0);
      // Show RETURN button
      ui.classList.remove('hidden');
      ui.classList.add('mini');
      ui.classList.add('done-state');
    }
  }
}

let mouthText=null;
let mouthBone=null;
const mouthTmp=new THREE.Vector3();
const mouthQ=new THREE.Quaternion();
const mouthLayer=document.getElementById('mouth-text-layer');
function findMouthBone(){
  if(!charModel)return null;
  let bone=null;
  charModel.traverse(o=>{
    if(bone||!o.isBone)return;
    const n=o.name.toLowerCase();
    if(n.includes('head')||n.includes('mouth')||n.includes('jaw'))bone=o;
  });
  return bone;
}
function getMouthWorldPos(){
  if(!mouthBone)mouthBone=findMouthBone();
  if(mouthBone){
    mouthBone.getWorldPosition(mouthTmp);
    mouthBone.getWorldQuaternion(mouthQ);
    const fwd=new THREE.Vector3(0,0,1).applyQuaternion(mouthQ);
    const down=new THREE.Vector3(0,-1,0).applyQuaternion(mouthQ);
    const f=charHalfHeight*0.12;
    const d=charHalfHeight*0.08;
    mouthTmp.add(fwd.multiplyScalar(f));
    mouthTmp.add(down.multiplyScalar(d));
    return mouthTmp;
  }
  return charRoot.localToWorld(new THREE.Vector3(0,charHalfHeight*0.6,0));
}
function makeTextEl(text){
  const el=document.createElement('div');
  el.className='mouth-text';
  el.textContent=text.length>10?text.slice(0,10)+'…':text;
  el.style.opacity='0';
  mouthLayer.appendChild(el);
  return el;
}
function getRecentTexts(n){
  const arr=[];
  for(const e of plantEntries){if(e.text)arr.push(e.text)}
  if(firstText)arr.push(firstText);
  const clean=arr.filter(t=>t&&t.trim());
  const out=clean.slice(-n);
  while(out.length<n)out.unshift(clean[clean.length-1]||'...');
  return out;
}
function startMouthText(){
  if(mouthText||!charModel)return;
  const texts=getRecentTexts(10);
  // Start position: the mini UI bubble (bottom-right corner)
  const uiEl=document.getElementById('ui');
  const uiR=uiEl.getBoundingClientRect();
  const startX=uiR.left+uiR.width*0.5;
  const startY=uiR.top+uiR.height*0.5;
  const items=[];
  for(let i=0;i<10;i++){
    const el=makeTextEl(texts[i]||'...');
    const jx=(Math.random()-0.5)*40, jy=(Math.random()-0.5)*24;
    const sx=startX+jx, sy=startY+jy;
    // Set initial position immediately so elements don't flash at (0,0)
    el.style.left=`${sx}px`;
    el.style.top=`${sy}px`;
    items.push({
      el,
      delay:Math.random()*0.3,
      dur:0.9+Math.random()*0.5,
      start:{x:sx,y:sy}
    });
  }
  mouthText={items,time:0};
}
function updateMouthText(dt){
  if(!mouthText)return;
  mouthText.time+=dt;
  const mouthWorld=getMouthWorldPos().clone();
  const mouthScreen=mouthWorld.project(camera);
  const endX=(mouthScreen.x*0.5+0.5)*W();
  const endY=(-mouthScreen.y*0.5+0.5)*H();
  let alive=false;
  for(const it of mouthText.items){
    const t=(mouthText.time-it.delay)/it.dur;
    if(t<0){it.el.style.opacity='0';alive=true;continue;}
    if(t<=1){
      alive=true;
      const u=Math.min(1,t);
      const x=it.start.x+(endX-it.start.x)*u;
      const y=it.start.y+(endY-it.start.y)*u;
      const flick=0.7+0.3*Math.sin((mouthText.time*28)+(it.delay*10));
      it.el.style.opacity=(flick*(1-u*0.6)).toFixed(3);
      it.el.style.transform=`translate(-50%,-50%) scale(${(1-u*0.85).toFixed(3)})`;
      it.el.style.left=`${x}px`;
      it.el.style.top=`${y}px`;
    }else{
      it.el.style.opacity='0';
    }
  }
  if(!alive){
    for(const it of mouthText.items){it.el.remove();}
    mouthText=null;
  }
}

function addPlant(text,grow=true,ts=null,username=''){
  let grp;
  try{grp=makePlant(text)}catch(e){console.error('Plant err:',e);return null}
  // Fill the whole disk, including its centre. Saved plants retain their stored positions.
  const rr=srand(hash(text)+plantEntries.length),n=plantEntries.length;
  const radius=Math.max(6,Math.sqrt((n+1)/(Math.PI*.45)));
  let best=new THREE.Vector3(),score=-Infinity;
  for(let i=0;i<33;i++){
    const a=rr()*Math.PI*2,r=i===0?0:radius*Math.sqrt(rr()),point=new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r);
    const gap=n?Math.min(...plantEntries.map(e=>(e.mesh.position.x-point.x)**2+(e.mesh.position.z-point.z)**2)):100;
    const merit=gap-r*r*.08;if(merit>score){score=merit;best=point;}
  }
  grp.position.copy(best);
  const mesh=grp.children[0];
  if(grow&&mesh){
    grp.userData.growStart=performance.now();
    grp.userData.growDur=1500+Math.random()*800;
    grp.userData.totalIdx=mesh.userData.totalIdx;
    grp.userData.phase=Math.random()*Math.PI*2;
    mesh.geometry.setDrawRange(0,3);
  }else if(mesh){
    mesh.geometry.setDrawRange(0,mesh.userData.totalIdx);
    grp.userData.phase=Math.random()*Math.PI*2;
  }
  grp.userData.entryUsername=username||'';
  plantRoot.add(grp);
  plantEntries.push({mesh:grp,text,ts:ts||new Date().toISOString(),pendingLabel:!!grow,username:username||''});
  // Spawn bugs around this plant's position
  spawnBugsAt(grp.position.x,grp.position.z,3+Math.floor(Math.random()*4));
  if(grow)lastPlantedPos=grp.position.clone();
  return grp;
}

  if(isJumping)return;isJumping=true;charVelY=JUMP_VEL*currentStats().jumpMultiplier;}

  }else{jumpVelX=0;jumpVelZ=0;}

const clock=new THREE.Clock();

function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),0.05);if(!window.__reletterTestPause)gameStep(dt);}
function gameStep(dt,renderFrame=true){
  restoreFishingPoses();
  restoreMeleePoses();
  updateOnline(dt);
  globalTime+=dt;
  phaseT+=dt;
  const now=performance.now();

  // Update input + character
  updateKeyboardJoy();
  animateChar(dt);
  // 3D arrow: bob up/down + flash + rotate
  if(arrowGroup.visible){
    arrowGroup.position.y=arrowFloatBase+Math.sin(globalTime*2)*0.6;
    const op=0.5+Math.sin(globalTime*6)*0.4;
    arrowGroup.children.forEach(c=>{if(c.material)c.material.opacity=op});
    arrowGroup.rotation.y=globalTime*1.5;
  }
  if(arrowBridge.visible){
    arrowBridge.position.y=bridgePos.y+3.5+Math.sin(globalTime*2)*0.6;
    const op2=0.5+Math.sin(globalTime*6)*0.4;
    arrowBridge.children.forEach(c=>{if(c.material)c.material.opacity=op2});
    arrowBridge.rotation.y=globalTime*1.5;
  }
  // Sky platforms: cloud-like drifting + carry character
  for(const sp of skyPlats){
    const ud=sp.userData;
    const prevX=sp.position.x,prevZ=sp.position.z,prevY=sp.position.y;
    sp.position.x=ud.baseX+Math.sin(globalTime*ud.driftSpeedX+ud.driftPhaseX)*ud.driftAmpX;
    sp.position.z=ud.baseZ+Math.cos(globalTime*ud.driftSpeedZ+ud.driftPhaseZ)*ud.driftAmpZ;
    sp.position.y=ud.noFloatY?ud.baseY:ud.baseY+Math.sin(globalTime*1.2+ud.floatPhase)*0.3;
    // Carry character if standing on this platform
    if(sp===currentSkyPlat&&!isJumping){
      charRoot.position.x+=sp.position.x-prevX;
      charRoot.position.z+=sp.position.z-prevZ;
      charRoot.position.y+=sp.position.y-prevY;
    }
  }
  // ? block: idle float + bounce on hit + red flash
  {
    const qd=qBlockGroup.userData;
    if(qd.bounceT>=0){
      qd.bounceT+=dt;
      const bDur=0.35;
      if(qd.bounceT<bDur){
        const bt=qd.bounceT/bDur;
        qBlockGroup.position.y=qd.baseY+Math.sin(bt*Math.PI)*1.5;
      }else{
        qBlockGroup.position.y=qd.baseY;
        qd.bounceT=-1;
      }
    }else{
      qBlockGroup.position.y=qd.baseY+Math.sin(globalTime*1.8)*0.3;
    }
    // Red flash after hit
    if(qd.flashT!==undefined&&qd.flashT>=0){
      qd.flashT+=dt;
      const flashDur=0.6;
      const qMesh=qBlockGroup.children[0];
      if(qd.flashT<flashDur){
        const fl=Math.sin(qd.flashT/flashDur*Math.PI);
        qMesh.material.forEach(m=>{m.color.setRGB(1,1-fl*0.8,1-fl);m.emissive.setRGB(fl,0,0);m.emissiveIntensity=fl*4});
      }else{
        qMesh.material.forEach(m=>{m.color.setRGB(0.96,0.77,0.26);m.emissive.setRGB(0,0,0);m.emissiveIntensity=0});
        qd.flashT=-1;
      }
    }
    qBlockGroup.rotation.y=globalTime*0.4;
  }
  updateBurst(dt);
  updateAura(dt);
  updateDrinkGlow(dt);
  updateMonsters(dt);
  updatePlayerHitEffect(dt);
  updateCoins(dt);
  updateMouthText(dt);
  if(burst){
    setPlantsDim(Math.min(1,burst.fadePlants));
  }else{
    setPlantsDim(0);
  }
  if(phase===PHASE.IDLE||phase===PHASE.DRINK||phase===PHASE.EXPLORE||phase===PHASE.ASCEND){
    updateSky(0);
  }

  // Camera: cinematic or orbit
  if(!cinematicCam(dt)){
    interTimer+=dt;
    if(interTimer>2)interacting=false;
    // No auto camera yaw/pitch/dist adjustments — fully manual orbit control
    if(phase===PHASE.IDLE||phase===PHASE.DRINK||phase===PHASE.EXPLORE||phase===PHASE.ASCEND){
      camTarget.x+=(charRoot.position.x-camTarget.x)*dt*4;
      camTarget.y+=(charRoot.position.y+1.5-camTarget.y)*dt*4;
      camTarget.z+=(charRoot.position.z-camTarget.z)*dt*4;
    }
    // During DONE phase: auto-orbit around the last planted plant until user touches
    if(phase===PHASE.DONE){
      if(lastPlantedPos){
        camTarget.x+=(lastPlantedPos.x-camTarget.x)*dt*2;
        camTarget.z+=(lastPlantedPos.z-camTarget.z)*dt*2;
        camTarget.y+=(2-camTarget.y)*dt*2;
      }else{
        const maxY=plantEntries.length>0?4:3;
        camTarget.y+=(maxY-camTarget.y)*dt*0.5;
      }
      if(!interacting){
        camYaw+=dt*0.4; // slow auto-orbit
        camPitch+=(0.25-camPitch)*dt*1.5;
        camDist+=(14-camDist)*dt*1.5;
      }
    }
    updateCam();
  }

  for(const entry of plantEntries){
    const g=entry.mesh;
    const m=g.children[0];
    if(!m||!m.geometry)continue;

    // Growth via drawRange
    if(g.userData.totalIdx!==undefined){
      const elapsed=now-g.userData.growStart;
      const t=Math.min(1,elapsed/g.userData.growDur);
      const ease=1-(1-t)*(1-t);
      const count=Math.ceil(ease*g.userData.totalIdx/3)*3;
      m.geometry.setDrawRange(0,count);
      if(t>=1){
        delete g.userData.totalIdx;
        if(entry.pendingLabel){
          showPlantLabel(entry);
          entry.pendingLabel=false;
        }
      }
    }

    // Organic wriggle
    const ph=g.userData.phase||0;
    g.rotation.x=Math.sin(globalTime*1.1+ph)*0.01+Math.sin(globalTime*2.3+ph*1.7)*0.005;
    g.rotation.z=(g.userData.replyTilt||0)+Math.cos(globalTime*0.85+ph*0.8)*0.01+Math.cos(globalTime*1.9+ph*1.3)*0.005;
  }

  // Plant label — fixed at bottom center of screen (no 3D tracking to avoid jitter)
  if(activeLabelEntry&&!labelFromHistory&&!plantWithinReach(activeLabelEntry))hidePlantLabel();
  if(activeLabelEntry&&activeLabelEntry.mesh)positionPlantLabel();

  // Update glow opacity pulse for highlighted plants
  for(const gm of glowMeshes){
    if(gm.material)gm.material.opacity=0.3+Math.sin(globalTime*4)*0.2;
  }

  updateBugs(globalTime);

  // Apply held equipment after movement, platform carry and all character transforms.
  applyMeleePoses();
  applyFishingPoses();
  updateFishingRods(fstate());
  // Update VHS uniforms + render
  vhsPass.uniforms.time.value=globalTime;
  if(renderFrame)composer.render();
}

// ===== Flying Bugs — orbit around plants =====
const BUG_COLORS=['#FDFD96','#FFB7B2','#B5E2FA','#DDA0DD','#FFA6C9','#88ff88'];
const bugGroup=new THREE.Group();
scene.add(bugGroup);
const bugs=[];
let bugMesh=null;

function rebuildBugMesh(){
  // Remove old mesh
  if(bugMesh){bugGroup.remove(bugMesh);bugMesh.geometry.dispose();bugMesh.material.dispose()}
  if(bugs.length===0)return;
  const pts=[],cols=[];
  for(const b of bugs){
    pts.push(0,0,0);
    cols.push(b.color.r,b.color.g,b.color.b);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  const mat=new THREE.PointsMaterial({size:0.08,vertexColors:true,transparent:true,opacity:0.85,depthWrite:false,sizeAttenuation:true});
  bugMesh=new THREE.Points(geo,mat);
  bugGroup.add(bugMesh);
}

function spawnBugsAt(cx,cz,count){
  for(let i=0;i<count;i++){
    const bc=new THREE.Color(BUG_COLORS[Math.floor(Math.random()*BUG_COLORS.length)]);
    bugs.push({
      orbitR:0.5+Math.random()*2,
      orbitSpeed:0.5+Math.random()*1.5,
      orbitPhase:Math.random()*Math.PI*2,
      yPhase:Math.random()*Math.PI*2,
      yAmp:0.3+Math.random()*1,
      yBase:0.5+Math.random()*5,
      cx:cx+(Math.random()-0.5)*1.5,
      cz:cz+(Math.random()-0.5)*1.5,
      type:Math.floor(Math.random()*4),
      color:bc
    });
  }
  rebuildBugMesh();
}

function updateBugs(t){
  if(!bugMesh)return;
  const posArr=bugMesh.geometry.getAttribute('position');
  for(let i=0;i<bugs.length;i++){
    const b=bugs[i];
    let x,y,z;
    const ang=t*b.orbitSpeed+b.orbitPhase;
    if(b.type===0){
      x=b.cx+Math.cos(ang)*b.orbitR;
      z=b.cz+Math.sin(ang)*b.orbitR;
      y=b.yBase+Math.sin(t*1.5+b.yPhase)*b.yAmp;
    }else if(b.type===1){
      x=b.cx+Math.sin(ang)*b.orbitR;
      z=b.cz+Math.sin(ang*2)*b.orbitR*0.5;
      y=b.yBase+Math.cos(t*1.2+b.yPhase)*b.yAmp;
    }else if(b.type===2){
      const sp=((t*0.3+b.orbitPhase)%6)/6;
      x=b.cx+Math.cos(ang)*b.orbitR*(1-sp*0.3);
      z=b.cz+Math.sin(ang)*b.orbitR*(1-sp*0.3);
      y=b.yBase+sp*b.yAmp*2;
    }else{
      x=b.cx+Math.sin(ang)*b.orbitR+Math.sin(t*3.7+b.yPhase)*0.3;
      z=b.cz+Math.cos(ang*0.7)*b.orbitR;
      y=b.yBase+Math.sin(t*2.1+b.yPhase)*b.yAmp+Math.sin(t*4.3)*0.15;
    }
    posArr.setXYZ(i,x,y,z);
  }
  posArr.needsUpdate=true;
}

function tintModel(model,character,cloneMaterials=true){
  model.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    const materials=(Array.isArray(o.material)?o.material:[o.material]).map(source=>{
      const material=cloneMaterials?source.clone():source;
      if(character==='Rae'&&!material.userData.reletterPurple){
        // The GLB uses one atlas for turquoise body, peach skin and facial details.
        // Recolour only cool turquoise texels, preserving the other atlas regions.
        material.color?.set('#ffffff');
        material.onBeforeCompile=shader=>{
          shader.uniforms.reletterPurple={value:new THREE.Color('#8b65c5')};
          shader.fragmentShader='uniform vec3 reletterPurple;\n'+shader.fragmentShader;
          shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>',`#include <map_fragment>
            vec3 reletterSource = diffuseColor.rgb;
            float reletterCool = smoothstep(0.02, 0.12, min(reletterSource.g, reletterSource.b) - reletterSource.r);
            reletterCool *= smoothstep(0.2, 0.5, reletterSource.b / max(reletterSource.g, 0.0001));
            float reletterTextureShade = clamp(dot(reletterSource, vec3(0.2126, 0.7152, 0.0722)) / 0.65, 0.65, 1.25);
            diffuseColor.rgb = mix(reletterSource, reletterPurple * reletterTextureShade, reletterCool);
          `);
        };
        material.customProgramCacheKey=()=>'reletter-rae-palette-v1';
        material.userData.reletterPurple=true;material.needsUpdate=true;
      }
      return material;
    });
    o.material=materials.length===1?materials[0]:materials;
  });
}

  shaft(.85,.055,wood);const pan=mesh(new THREE.CylinderGeometry(.48*scale,.44*scale,.11,48),new THREE.MeshStandardMaterial({color:'#29323d',metalness:.9,roughness:.3}),0,1.12,0);pan.rotation.x=Math.PI/2;

  const rim=mesh(new THREE.TorusGeometry(.48*scale,.05,10,40),enamel,0,.67*scale,0);rim.rotation.x=Math.PI/2;
  mesh(new THREE.CylinderGeometry(.43*scale,.43*scale,.045,32),new THREE.MeshStandardMaterial({color:'#302a28',roughness:1}),0,.64*scale,0);
  for(let i=0;i<8+tier*2;i++){const a=i*2.4,r=.18*scale;const m=leaf(Math.cos(a)*r,.67*scale,Math.sin(a)*r,a,.55*scale,.17*scale);m.rotation.z=Math.sin(a)*.65;}
  for(let i=0;i<tier+2;i++){const a=i*2.4;mesh(new THREE.IcosahedronGeometry(.09,1),enamel,Math.cos(a)*.28*scale,.95*scale+Math.sin(a)*.2,Math.sin(a)*.28*scale);}

  const h=2.5*scale;shaft(h,.105,wood);
  for(let i=0;i<18;i++){const ring=mesh(new THREE.TorusGeometry(.108,.009,5,14),gold,0,i*h/18,0);ring.rotation.x=Math.PI/2;}
  for(let i=0;i<9+tier;i++){const a=i/(9+tier)*Math.PI*2;const shape=new THREE.Shape();shape.moveTo(0,0);for(let j=1;j<=14;j++){const t=j/14;shape.lineTo(t*1.3*scale,Math.sin(t*Math.PI)*.26*scale*(j%2?.7:1));}for(let j=14;j>=0;j--){const t=j/14;shape.lineTo(t*1.3*scale,-Math.sin(t*Math.PI)*.26*scale*(j%2?.7:1));}const frond=mesh(new THREE.ShapeGeometry(shape),leafMat,0,h-.12,0);frond.rotation.set(Math.PI/2+.25,a,0);}

import {SEEDS,HARVESTS,seedById,cropProgress} from './garden-catalog.js';
import {WINGS} from './wing-catalog.js';
import {botanicalCanvas,attachWings,createWings,disposeGardenModel} from './garden-art.js';
const gardenButton=document.createElement('button');gardenButton.id='garden-open';gardenButton.textContent='GARDEN';dock.append(gardenButton);
gardenButton.onclick=()=>{claimPanel('bag');bagPanelOpen=true;bagPanel.hidden=false;bagTab='garden';$('bag-detail').textContent='Select seeds or harvested plants below.';refreshBag(true);reflectPanels();};
let gardenBusy=false,gardenRefreshAt=0,lastWingFlap=0;
const cropModels=new Map(),wingModels=new Map(),wingLootModels=new Map(),flowerModels=new Map();
function currentWings(){return equipmentById(gameView.equipment?.[selectedCharacter]?.wings);}
function flapWings(){const w=currentWings();if(!w||phase!==PHASE.EXPLORE||document.body.dataset.panel!=='none'||performance.now()-lastWingFlap<w.flapMs||charRoot.position.y>38)return false;lastWingFlap=performance.now();charRoot.userData.wingFlight=true;isJumping=true;charVelY=w.impulse*currentStats().jumpMultiplier;return true;}
function wingGravity(){return currentWings()&&phase===PHASE.EXPLORE?currentWings().gravity:1;}
function renderGardenBag(){const stacks=gameView.garden?.stacks?.[selectedCharacter]||{},area=$('bag-items');area.classList.add('garden-view');const crops=(gameView.garden?.crops||[]).filter(c=>distanceTo(c.position)<5&&Math.abs(charRoot.position.y)<3),drops=(gameView.wingDrops||[]).filter(d=>!d.claimed.includes(selectedCharacter)&&distanceTo(d.position)<4);area.innerHTML='<div class="garden-help">Seeds: SHOP → Seeds. Plant on the ground, water nearby plants, then harvest blooms.</div>'+drops.map(d=>`<button class="garden-crop" data-garden-action="wing-pickup" data-id="${d.id}">PICK UP · ${equipmentById(d.choices[selectedCharacter]).name}</button>`).join('')+crops.map(c=>{const s=seedById(c.species),n=Math.floor(cropProgress(c)*100),wet=Math.max(0,Math.ceil((c.wetUntil-Date.now())/1000));return `<article class="garden-crop"><b>${HARVESTS[c.species-1].name}</b><progress max="100" value="${n}"></progress><small>${n}% · Water ${Math.min(s.waterNeed,Math.ceil(wet*1000/(s.growMs/s.waterNeed)))}/${s.waterNeed} · ${wet}s</small><button data-garden-action="${n>=100?'crop-harvest':'crop-water'}" data-id="${c.id}">${n>=100?'HARVEST':'WATER'}</button></article>`;}).join('')+Object.entries(stacks).filter(([id,n])=>n>0).map(([id,n])=>{const item=equipmentById(id);return `<button class="bag-cell" data-garden-item="${id}" title="${item.name}"><img src="${itemIcon(item)}" alt="${item.name}"><small>×${n}</small></button>`;}).join('');}
function inspectGardenItem(id){const item=equipmentById(id);if(!item)return;const detail=$('bag-detail');detail.replaceChildren();const title=document.createElement('strong');title.textContent=item.name;detail.append(title,document.createTextNode(item.description));for(const [action,label] of item.slot==='seed'?[['seed-plant','PLANT AHEAD']]:[['harvest-eat','EAT'],['harvest-arrange','ARRANGE ON NEARBY BLOCK']]){const b=document.createElement('button');b.textContent=label;b.dataset.gardenAction=action;b.dataset.item=id;detail.append(b);}}
async function gardenActionUI(body){if(gardenBusy)return;gardenBusy=true;try{if(body.action==='seed-plant'){body.position=[charRoot.position.x-Math.sin(charModel?.rotation.y||0)*2,0,charRoot.position.z-Math.cos(charModel?.rotation.y||0)*2];}if(body.action==='harvest-arrange'){const blocks=(gameView.blocks||[]).filter(b=>distanceTo(b.position)<8).sort((a,b)=>distanceTo(a.position)-distanceTo(b.position));if(!blocks.length)throw Error('Move beside a built block');body.block=blocks[0].id;}const r=await api('/api/game',body);if(r.game)receiveGame(r.game);if(body.action==='crop-water'){const c=gameView.garden.crops.find(c=>c.id===body.id);if(c)waterCropVisual(c.position);}centerNotice(body.action==='crop-harvest'?'HARVESTED':body.action==='wing-pickup'?'WINGS COLLECTED':body.action==='harvest-eat'?'BUFF ACTIVE':'GARDEN UPDATED');if(['seed-plant','harvest-arrange'].includes(body.action))claimPanel('none');else refreshBag(true);}catch(e){$('bag-feedback').textContent=e.message;centerNotice(e.message);}finally{gardenBusy=false;}}
bagPanel.addEventListener('click',e=>{const item=e.target.closest('[data-garden-item]');if(item){inspectGardenItem(item.dataset.gardenItem);return;}const b=e.target.closest('[data-garden-action]');if(b)gardenActionUI({action:b.dataset.gardenAction,item:b.dataset.item,id:b.dataset.id});});
const gardenCSS=document.createElement('style');gardenCSS.textContent=`#action-dock{grid-template-columns:repeat(8,minmax(0,1fr))!important}@media(max-width:600px) and (min-height:500px){#action-dock{grid-template-columns:repeat(4,minmax(0,1fr))!important}}#bag-items.garden-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));grid-auto-rows:min-content;align-content:start}.garden-help,.garden-crop{grid-column:1/-1}.garden-crop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;background:#e8f0e5;border-radius:12px}.garden-crop progress{width:80px;flex:1}.garden-crop button{padding:5px 12px}.garden-help{padding:8px;font:12px/1.5 sans-serif}.garden-view .bag-cell{position:relative}.garden-view small{font:10px sans-serif}.garden-view .bag-cell small{position:absolute;bottom:1px;right:3px;background:#fff9;border-radius:4px}#bag-detail:has([data-garden-action]){max-height:135px;overflow:auto}#bag-detail [data-garden-action]{margin:4px;padding:4px 8px}.shop-tabs{overflow-x:auto}.shop-tabs button{flex-shrink:0}`;document.head.append(gardenCSS);
const cropTextures=new Map();
function makeCropModel(species,stage){const s=seedById(species),root=new THREE.Group(),textureKey=species+':'+stage;let texture=cropTextures.get(textureKey);if(!texture){texture=new THREE.CanvasTexture(botanicalCanvas(species,s.color,stage));texture.colorSpace=THREE.SRGBColorSpace;texture.userData.sharedGarden=true;cropTextures.set(textureKey,texture);}const mat=new THREE.MeshStandardMaterial({map:texture,transparent:true,alphaTest:.18,side:THREE.DoubleSide,roughness:1});for(let i=0;i<2;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.25),mat);m.position.y=1.05;m.rotation.y=i*Math.PI/2;root.add(m);}return root;}
function waterCropVisual(position){const geo=new THREE.BufferGeometry(),p=[];for(let i=0;i<40;i++)p.push((Math.random()-.5)*1.2,Math.random()*2,(Math.random()-.5)*1.2);geo.setAttribute('position',new THREE.Float32BufferAttribute(p,3));const o=new THREE.Points(geo,new THREE.PointsMaterial({color:'#9cdbec',size:.07,transparent:true,opacity:.8}));o.position.fromArray(position);o.userData.waterEnd=performance.now()+900;scene.add(o);gardenWater.push(o);}
const gardenWater=[];
function updateCultivation(dt){
 const players=[{character:selectedCharacter,model:charModel},...remotePlayers.values()],present=new Set();
 for(const p of players){if(!p.model)continue;present.add(p.character);const id=gameView.equipment?.[p.character]?.wings;let old=wingModels.get(p.character);if(old?.id!==id||old?.model!==p.model){disposeGardenModel(old?.root);old={id,model:p.model,root:attachWings(THREE,p.model,equipmentById(id))};wingModels.set(p.character,old);}if(old?.root)old.root.children.forEach((o,i)=>o.rotation.y=(i?1:-1)*(.18+Math.sin(globalTime*5)*.22));}
 for(const [k,o] of wingModels)if(!present.has(k)){disposeGardenModel(o.root);wingModels.delete(k);}
 const live=new Set();for(const c of gameView.garden?.crops||[]){live.add(c.id);const progress=cropProgress(c),stage=progress>=1?3:progress>.35?2:progress>0?1:0;let o=cropModels.get(c.id);if(!o||o.userData.stage!==stage){disposeGardenModel(o);o=makeCropModel(c.species,stage);o.userData.stage=stage;o.position.fromArray(c.position);scene.add(o);cropModels.set(c.id,o);}o.visible=distanceTo(c.position)<90;}
 for(const [id,o] of cropModels)if(!live.has(id)){disposeGardenModel(o);cropModels.delete(id);}
 const blooms=new Set();for(const b of gameView.blocks||[])for(let i=0;i<(b.flowers||[]).length;i++){const f=b.flowers[i];blooms.add(f.id);if(!flowerModels.has(f.id)){const o=makeCropModel(f.species,3);o.scale.setScalar(.55);const a=i*2.4,r=Math.min((b.size?.[0]||2)/3,.2+i*.05);o.position.set(b.position[0]+Math.cos(a)*r,b.position[1]+(b.size?.[1]||1),b.position[2]+Math.sin(a)*r);scene.add(o);flowerModels.set(f.id,o);}}for(const [id,o] of flowerModels)if(!blooms.has(id)){disposeGardenModel(o);flowerModels.delete(id);}
 const drops=new Set();for(const d of gameView.wingDrops||[]){if(d.claimed.includes(selectedCharacter))continue;drops.add(d.id);let o=wingLootModels.get(d.id);if(!o){o=createWings(THREE,equipmentById(d.choices[selectedCharacter]));scene.add(o);wingLootModels.set(d.id,o);}o.position.set(d.position[0],d.position[1]+1.5+Math.sin(globalTime*2)*.15,d.position[2]);o.rotation.y=globalTime*.5;}for(const [id,o] of wingLootModels)if(!drops.has(id)){disposeGardenModel(o);wingLootModels.delete(id);}
 for(let i=gardenWater.length-1;i>=0;i--){const o=gardenWater[i];o.position.y-=dt;if(performance.now()>o.userData.waterEnd){disposeGardenModel(o);gardenWater.splice(i,1);}}
 if(performance.now()>gardenRefreshAt){gardenRefreshAt=performance.now()+1000;if(bagPanelOpen&&bagTab==='garden')renderGardenBag();const near=(gameView.wingDrops||[]).some(d=>!d.claimed.includes(selectedCharacter)&&distanceTo(d.position)<4);gardenButton.textContent=near?'WINGS!':'GARDEN';}
}

// ===== Init =====
async function init(){await entryGate;tick();await loadSaved()}
init();

window.addEventListener('resize',()=>{
  renderer.setSize(W(),H());
  composer.setSize(W(),H());
  camera.aspect=W()/H();
  camera.updateProjectionMatrix();
  vhsPass.uniforms.resolution.value.set(W(),H());
});
</script>
</body>
</html>
